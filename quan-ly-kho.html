<script>
'use strict';
/* ==================== CORE: UTILITIES & STORAGE ==================== */

function $(sel){ return document.querySelector(sel); }
function $$(sel){ return Array.prototype.slice.call(document.querySelectorAll(sel)); }

function esc(s){
  if(s===null||s===undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,9); }
function pad2(n){ return (n<10?'0':'')+n; }
function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function dayOffset(off){ var d=new Date(); d.setDate(d.getDate()+off); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function nowISO(){ return new Date().toISOString(); }
function round2(n){ return Math.round((+n + Number.EPSILON)*100)/100; }
function round3(n){ return Math.round((+n + Number.EPSILON)*1000)/1000; }
function parseNum(v){
  if(typeof v==='number') return isFinite(v)?v:0;
  if(v===null||v===undefined) return 0;
  var s=String(v).trim().replace(/\s/g,'');
  if(!s) return 0;
  // "1.234.567" hoặc "1,234,567" (phân tách nghìn) / "1234,5" (thập phân kiểu VN)
  if(/^\d{1,3}(\.\d{3})+(,\d+)?$/.test(s)) s=s.replace(/\./g,'').replace(',','.');
  else if(/^\d{1,3}(,\d{3})+(\.\d+)?$/.test(s)) s=s.replace(/,/g,'');
  else s=s.replace(',','.');
  var n=parseFloat(s);
  return isFinite(n)?n:0;
}
function fmtMoney(n){ n=Math.round(+n||0); return n.toLocaleString('vi-VN'); }
function fmtQty(n){ n=+n||0; return n.toLocaleString('vi-VN',{maximumFractionDigits:3}); }
function fmtDate(d){ if(!d) return '—'; var p=String(d).slice(0,10).split('-'); return p.length===3 ? p[2]+'/'+p[1]+'/'+p[0] : d; }
function fmtDateTime(iso){
  if(!iso) return '—';
  var d=new Date(iso);
  return pad2(d.getDate())+'/'+pad2(d.getMonth()+1)+'/'+d.getFullYear()+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function normStr(s){ return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\u0111/g,'d').trim(); }

/* ---------- SHA-256 (thuần JS, chạy được cả khi không có crypto.subtle) ---------- */
function sha256(ascii){
  function rightRotate(value, amount){ return (value>>>amount) | (value<<(32-amount)); }
  var mathPow=Math.pow, maxWord=mathPow(2,32), i, j, result='';
  var words=[], asciiBitLength=ascii.length*8;
  var hash=sha256.h=sha256.h||[], k=sha256.k=sha256.k||[];
  var primeCounter=k.length;
  var isComposite={};
  for(var candidate=2; primeCounter<64; candidate++){
    if(!isComposite[candidate]){
      for(i=0;i<313;i+=candidate){ isComposite[i]=candidate; }
      hash[primeCounter]=(mathPow(candidate,.5)*maxWord)|0;
      k[primeCounter++]=(mathPow(candidate,1/3)*maxWord)|0;
    }
  }
  ascii+='\x80';
  while(ascii.length%64-56) ascii+='\x00';
  for(i=0;i<ascii.length;i++){
    j=ascii.charCodeAt(i);
    if(j>>8) return null;
    words[i>>2] |= j << ((3-i)%4)*8;
  }
  words[words.length]=((asciiBitLength/maxWord)|0);
  words[words.length]=(asciiBitLength);
  for(j=0;j<words.length;){
    var w=words.slice(j,j+=16);
    var oldHash=hash;
    hash=hash.slice(0,8);
    for(i=0;i<64;i++){
      var w15=w[i-15], w2=w[i-2];
      var a=hash[0], e=hash[4];
      var temp1=hash[7]
        + (rightRotate(e,6)^rightRotate(e,11)^rightRotate(e,25))
        + ((e&hash[5])^((~e)&hash[6]))
        + k[i]
        + (w[i]=(i<16)?w[i]:( w[i-16] + (rightRotate(w15,7)^rightRotate(w15,18)^(w15>>>3)) + w[i-7] + (rightRotate(w2,17)^rightRotate(w2,19)^(w2>>>10)) )|0);
      var temp2=(rightRotate(a,2)^rightRotate(a,13)^rightRotate(a,22)) + ((a&hash[1])^(a&hash[2])^(hash[1]&hash[2]));
      hash=[(temp1+temp2)|0].concat(hash);
      hash[4]=(hash[4]+temp1)|0;
    }
    for(i=0;i<8;i++){ hash[i]=(hash[i]+oldHash[i])|0; }
  }
  for(i=0;i<8;i++){
    for(j=3;j+1;j--){
      var b=(hash[i]>>(j*8))&255;
      result += ((b<16)?0:'') + b.toString(16);
    }
  }
  return result;
}
function hashPass(pass){ return sha256(unescape(encodeURIComponent('qlk::'+String(pass)))); }

/* ---------- Đọc số tiền bằng chữ ---------- */
function docSoTien(so){
  var neg = so<0;
  so=Math.round(Math.abs(+so||0));
  if(so===0) return 'Không đồng';
  var chuSo=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'];
  var donVi=['',' nghìn',' triệu',' tỷ',' nghìn tỷ',' triệu tỷ'];
  function doc3(n, full){
    var tram=Math.floor(n/100), chuc=Math.floor((n%100)/10), dv=n%10, s='';
    if(full || tram>0) s+=chuSo[tram]+' trăm';
    if(chuc>1){
      s+=' '+chuSo[chuc]+' mươi';
      if(dv===1) s+=' mốt'; else if(dv===4) s+=' tư'; else if(dv===5) s+=' lăm'; else if(dv>0) s+=' '+chuSo[dv];
    } else if(chuc===1){
      s+=' mười';
      if(dv===5) s+=' lăm'; else if(dv>0) s+=' '+chuSo[dv];
    } else if(dv>0){
      if(s) s+=' lẻ';
      s+=' '+chuSo[dv];
    }
    return s.trim();
  }
  var groups=[];
  while(so>0){ groups.push(so%1000); so=Math.floor(so/1000); }
  var out='';
  for(var i=groups.length-1;i>=0;i--){
    var g=groups[i];
    if(g>0) out += (out?' ':'') + doc3(g, out!=='') + donVi[i];
  }
  out=(neg?'âm ':'')+out+' đồng';
  return out.charAt(0).toUpperCase()+out.slice(1);
}

/* ---------- Cấu hình ---------- */
var ROLES={ admin:'Quản trị', manager:'Quản lý', staff:'Nhân viên' };
var VTYPES={
  in:        { code:'PN', name:'Nhập kho',            icon:'📥', color:'#16a34a', flow:'+' },
  out:       { code:'PX', name:'Xuất kho',            icon:'📤', color:'#ea580c', flow:'-' },
  transfer:  { code:'CK', name:'Chuyển kho',          icon:'🔁', color:'#2563eb', flow:'~' },
  return_sup:{ code:'TN', name:'Trả hàng NCC',        icon:'↩️', color:'#dc2626', flow:'-' },
  return_cus:{ code:'KT', name:'Khách trả hàng',      icon:'♻️', color:'#7c3aed', flow:'+' },
  adjust:    { code:'KK', name:'Điều chỉnh kiểm kê',  icon:'📋', color:'#0891b2', flow:'~' }
};
/* Phiếu thu / chi (quản lý công nợ) */
var PTYPES={
  receipt: { code:'PT', name:'Phiếu thu', icon:'💰', color:'#16a34a' },
  payment: { code:'PC', name:'Phiếu chi', icon:'💸', color:'#dc2626' }
};

/* ---------- Trạng thái toàn cục ---------- */
var DB=null;
var SESSION=null;
var storageOK=true;
var DB_KEY='qlk_data_v1';

function storageAvailable(){
  try{ localStorage.setItem('__qlk_test','1'); localStorage.removeItem('__qlk_test'); return true; }
  catch(e){ return false; }
}
function loadDB(){
  if(!storageOK) return null;
  try{
    var raw=localStorage.getItem(DB_KEY);
    if(!raw) return null;
    var obj=JSON.parse(raw);
    if(!obj || !obj.users || !obj.products) return null;
    return migrateDB(obj);
  }catch(e){ return null; }
}
function saveDB(){
  if(!DB) return;
  DB.meta.updatedAt=nowISO();
  if(!storageOK) return;
  try{ localStorage.setItem(DB_KEY, JSON.stringify(DB)); }
  catch(e){
    if(typeof toast==='function') toast('Không lưu được dữ liệu: '+e.message,'error');
  }
}
function defaultDB(){
  return migrateDB({
    meta:{ app:'qlk', version:1, createdAt:nowISO(), updatedAt:nowISO(), demo:false, lastBackupAt:null },
    settings:{ companyName:'', companyAddress:'', companyPhone:'', companyTax:'' },
    users:[{ id:uid(), username:'admin', passHash:hashPass('admin123'), fullName:'Quản trị hệ thống', role:'admin', active:true, createdAt:nowISO() }],
    categories:[], products:[], partners:[], warehouses:[],
    stocks:{}, vouchers:[], payments:[], auditLog:[], counters:{}
  });
}
function migrateDB(obj){
  obj.meta=obj.meta||{app:'qlk',version:1,createdAt:nowISO()};
  obj.settings=obj.settings||{};
  obj.users=obj.users||[]; obj.categories=obj.categories||[]; obj.products=obj.products||[];
  obj.partners=obj.partners||[]; obj.warehouses=obj.warehouses||[];
  obj.stocks=obj.stocks||{}; obj.vouchers=obj.vouchers||[]; obj.payments=obj.payments||[]; obj.auditLog=obj.auditLog||[]; obj.counters=obj.counters||{};
  // Di trú công nợ: phiếu có tiền lập trước khi có tính năng thanh toán (thiếu trường paid)
  // được coi là ĐÃ THANH TOÁN ĐỦ để công nợ khởi điểm bằng 0 (không hồi tố nợ cũ).
  obj.vouchers.forEach(function(v){
    if(v.paid===undefined) v.paid=(v.type==='in'||v.type==='out'||v.type==='return_sup'||v.type==='return_cus') ? (v.total||0) : 0;
  });
  return obj;
}

/* ---------- Nhật ký thao tác ---------- */
function audit(action, detail){
  if(!DB) return;
  DB.auditLog.unshift({ id:uid(), time:nowISO(), username:SESSION?SESSION.username:'hệ thống', action:action, detail:detail||'' });
  if(DB.auditLog.length>3000) DB.auditLog.length=3000;
}

/* ---------- Phân quyền ---------- */
function isAdmin(){ return !!SESSION && SESSION.role==='admin'; }
function isMgr(){ return !!SESSION && (SESSION.role==='admin'||SESSION.role==='manager'); }

/* ---------- Tra cứu nhanh ---------- */
function prodById(id){ return DB.products.find(function(p){return p.id===id;}); }
function whById(id){ return DB.warehouses.find(function(w){return w.id===id;}); }
function partnerById(id){ return DB.partners.find(function(p){return p.id===id;}); }
function catById(id){ return DB.categories.find(function(c){return c.id===id;}); }
function whName(id){ var w=whById(id); return w?w.name:'—'; }
function partnerName(id){ var p=partnerById(id); return p?p.name:'—'; }
function catName(id){ var c=catById(id); return c?c.name:''; }
function activeProducts(){ return DB.products.filter(function(p){return p.active!==false;}); }
function activeWarehouses(){ return DB.warehouses.filter(function(w){return w.active!==false;}); }
function activePartners(type){ return DB.partners.filter(function(p){return p.active!==false && (!type||p.type===type);}); }
</script>

<script>
'use strict';
/* ==================== ENGINE: TỒN KHO, GIÁ VỐN, PHIẾU ==================== */

function getStock(whId, pid){
  return (DB.stocks[whId] && DB.stocks[whId][pid]) || 0;
}
function addStock(whId, pid, delta){
  if(!DB.stocks[whId]) DB.stocks[whId]={};
  var nv=round3((DB.stocks[whId][pid]||0)+delta);
  if(Math.abs(nv)<1e-9) delete DB.stocks[whId][pid];
  else DB.stocks[whId][pid]=nv;
}
function totalStock(pid){
  var t=0;
  for(var w in DB.stocks){ t+=(DB.stocks[w][pid]||0); }
  return round3(t);
}
function stockValueTotal(){
  var v=0;
  DB.products.forEach(function(p){ v+=totalStock(p.id)*(p.costPrice||0); });
  return v;
}
function nextCode(type){
  var c=DB.counters[type]||1;
  DB.counters[type]=c+1;
  return VTYPES[type].code + String(c).padStart(5,'0');
}
/* Phiếu có giá trị tiền với đối tác (tham gia công nợ) */
function isMoneyVoucher(t){ return t==='in'||t==='out'||t==='return_sup'||t==='return_cus'; }

/*
 postVoucher(inp) — ghi 1 phiếu và cập nhật tồn + giá vốn.
 inp = { type, date, warehouseId, toWarehouseId?, partnerId?, note?, lines:[{productId, qty, price}] }
 - in         : nhập kho (qty>0, price = đơn giá nhập) → tăng tồn, cập nhật giá vốn bình quân gia quyền
 - out        : xuất kho (price = giá bán) → giảm tồn, chốt cost = giá vốn hiện tại để tính lợi nhuận
 - transfer   : chuyển kho nguồn → đích (không giá trị doanh thu)
 - return_sup : trả hàng cho NCC (giảm tồn, price = giá trả lại, mặc định giá vốn)
 - return_cus : khách trả lại (tăng tồn, price = giá hoàn cho khách, trừ doanh thu)
 - adjust     : điều chỉnh kiểm kê (qty là chênh lệch +/-, giá trị tính theo giá vốn)
*/
function validateVoucherInput(inp){
  var t=inp.type, vt=VTYPES[t];
  if(!vt) return {ok:false, error:'Loại phiếu không hợp lệ'};
  if(!inp.warehouseId || !whById(inp.warehouseId)) return {ok:false, error:'Chưa chọn kho'};
  if(t==='transfer'){
    if(!inp.toWarehouseId || !whById(inp.toWarehouseId)) return {ok:false, error:'Chưa chọn kho nhận'};
    if(inp.toWarehouseId===inp.warehouseId) return {ok:false, error:'Kho xuất và kho nhận phải khác nhau'};
  }
  var lines=(inp.lines||[]).filter(function(l){
    return l.productId && prodById(l.productId) && (t==='adjust' ? Math.abs(+l.qty||0)>1e-9 : (+l.qty||0)>0);
  });
  if(!lines.length) return {ok:false, error:'Phiếu phải có ít nhất một dòng hàng với số lượng hợp lệ'};

  // Kiểm tra tồn cho các luồng xuất
  var need={};
  lines.forEach(function(l){
    var q=round3(+l.qty);
    if(t==='out'||t==='return_sup'||t==='transfer') need[l.productId]=(need[l.productId]||0)+q;
    if(t==='adjust' && q<0) need[l.productId]=(need[l.productId]||0)+(-q);
  });
  for(var pid in need){
    var have=getStock(inp.warehouseId, pid);
    if(need[pid] > have + 1e-9){
      var p=prodById(pid);
      return {ok:false, error:'Không đủ tồn kho: "'+(p?p.name:'?')+'" tại '+whName(inp.warehouseId)+' chỉ còn '+fmtQty(have)+' '+(p?p.unit:'')};
    }
  }
  return {ok:true, lines:lines};
}

/* Áp các dòng hàng (đã validate) vào phiếu v: cập nhật tồn kho + giá vốn, ghi v.lines/v.total */
function applyVoucherLines(v, lines){
  var t=v.type;
  v.lines=[]; v.total=0;
  lines.forEach(function(l){
    var p=prodById(l.productId);
    var qty=round3(+l.qty);
    var price=round2(parseNum(l.price));
    var cost=round2(p.costPrice||0);

    if(t==='in'){
      var tq=totalStock(p.id);
      var newCost=(tq+qty)>0 ? ((tq*(p.costPrice||0)) + qty*price)/(tq+qty) : price;
      p.costPrice=round2(newCost);
      addStock(v.warehouseId, p.id, qty);
      cost=p.costPrice;
    } else if(t==='out'){
      addStock(v.warehouseId, p.id, -qty);
    } else if(t==='transfer'){
      addStock(v.warehouseId, p.id, -qty);
      addStock(v.toWarehouseId, p.id, qty);
      price=0;
    } else if(t==='return_sup'){
      addStock(v.warehouseId, p.id, -qty);
      if(!price) price=cost;
    } else if(t==='return_cus'){
      addStock(v.warehouseId, p.id, qty);
    } else if(t==='adjust'){
      addStock(v.warehouseId, p.id, qty); // qty là chênh lệch +/-
      price=cost;
    }
    v.lines.push({ productId:p.id, sku:p.sku, name:p.name, unit:p.unit, qty:qty, price:price, cost:cost });
    v.total=round2(v.total + qty*price);
  });
}

function postVoucher(inp){
  var val=validateVoucherInput(inp);
  if(!val.ok) return val;
  var t=inp.type;
  var v={
    id:uid(), code:nextCode(t), type:t,
    date:(inp.date||todayStr()).slice(0,10),
    warehouseId:inp.warehouseId, toWarehouseId:inp.toWarehouseId||null,
    partnerId:inp.partnerId||null, note:inp.note||'',
    lines:[], total:0, status:'posted',
    createdBy:SESSION?SESSION.username:'hệ thống', createdAt:nowISO()
  };
  applyVoucherLines(v, val.lines);
  v.paid=isMoneyVoucher(t) ? Math.max(0, round2(parseNum(inp.paid))) : 0;
  DB.vouchers.unshift(v);
  audit('Tạo phiếu', VTYPES[t].name+' '+v.code+' — '+v.lines.length+' dòng, tổng '+fmtMoney(v.total)+' đ'+(isMoneyVoucher(t)&&v.paid<v.total?', đã TT '+fmtMoney(v.paid)+' đ':''));
  saveDB();
  return {ok:true, voucher:v};
}

/* Cộng lại đúng tác động số lượng của nội dung phiếu cũ (nghịch đảo applyReversal, không đụng giá vốn) */
function reapplyOldEffects(type, old){
  old.lines.forEach(function(l){
    if(type==='in'||type==='return_cus') addStock(old.warehouseId, l.productId, +l.qty);
    else if(type==='out'||type==='return_sup') addStock(old.warehouseId, l.productId, -l.qty);
    else if(type==='transfer'){
      addStock(old.warehouseId, l.productId, -l.qty);
      addStock(old.toWarehouseId, l.productId, +l.qty);
    }
    else if(type==='adjust') addStock(old.warehouseId, l.productId, +l.qty);
  });
}

/* Sửa phiếu đã ghi sổ: hoàn tác tác động cũ → kiểm tra nội dung mới → áp dụng.
   Nếu nội dung mới không hợp lệ thì hoàn nguyên nguyên trạng (rollback). */
function updateVoucher(id, inp){
  var v=DB.vouchers.find(function(x){return x.id===id;});
  if(!v) return {ok:false, error:'Không tìm thấy phiếu'};
  if(v.status==='void') return {ok:false, error:'Phiếu đã hủy — không thể sửa'};
  if(inp.type && inp.type!==v.type) return {ok:false, error:'Không thể đổi loại phiếu'};
  inp.type=v.type;

  var old={ warehouseId:v.warehouseId, toWarehouseId:v.toWarehouseId, lines:v.lines };
  var r=applyReversal(v);
  if(!r.ok) return {ok:false, error:'Không thể sửa: '+r.error};

  var val=validateVoucherInput(inp);
  if(!val.ok){
    reapplyOldEffects(v.type, old); // rollback về nguyên trạng
    return val;
  }
  v.date=(inp.date||v.date).slice(0,10);
  v.warehouseId=inp.warehouseId;
  v.toWarehouseId=inp.toWarehouseId||null;
  v.partnerId=inp.partnerId||null;
  v.note=inp.note||'';
  applyVoucherLines(v, val.lines);
  v.paid=isMoneyVoucher(v.type) ? Math.max(0, round2(parseNum(inp.paid))) : 0;
  v.editedBy=SESSION?SESSION.username:'hệ thống';
  v.editedAt=nowISO();
  audit('Sửa phiếu', VTYPES[v.type].name+' '+v.code+' — '+v.lines.length+' dòng, tổng mới '+fmtMoney(v.total)+' đ');
  saveDB();
  return {ok:true, voucher:v};
}

/* Hoàn tác tác động tồn kho của một phiếu (dùng chung cho hủy & xóa) */
function applyReversal(v){
  var deltas=[];
  v.lines.forEach(function(l){
    if(v.type==='in'||v.type==='return_cus') deltas.push({wh:v.warehouseId, pid:l.productId, d:-l.qty});
    else if(v.type==='out'||v.type==='return_sup') deltas.push({wh:v.warehouseId, pid:l.productId, d:+l.qty});
    else if(v.type==='transfer'){
      deltas.push({wh:v.toWarehouseId, pid:l.productId, d:-l.qty});
      deltas.push({wh:v.warehouseId, pid:l.productId, d:+l.qty});
    }
    else if(v.type==='adjust') deltas.push({wh:v.warehouseId, pid:l.productId, d:-l.qty});
  });
  var byKey={};
  deltas.forEach(function(x){ var k=x.wh+'|'+x.pid; byKey[k]=(byKey[k]||0)+x.d; });
  for(var k in byKey){
    var parts=k.split('|');
    if(getStock(parts[0],parts[1]) + byKey[k] < -1e-9){
      var p=prodById(parts[1]);
      return {ok:false, error:'tồn kho hiện tại của "'+(p?p.name:'?')+'" không đủ để hoàn tác phiếu này'};
    }
  }
  deltas.forEach(function(x){ addStock(x.wh, x.pid, x.d); });
  return {ok:true};
}

/* Hủy phiếu: hoàn tác tồn kho, giữ lại phiếu trong lịch sử (giá vốn bình quân giữ nguyên) */
function voidVoucher(id){
  var v=DB.vouchers.find(function(x){return x.id===id;});
  if(!v) return {ok:false, error:'Không tìm thấy phiếu'};
  if(v.status==='void') return {ok:false, error:'Phiếu này đã hủy trước đó'};
  var r=applyReversal(v);
  if(!r.ok) return {ok:false, error:'Không thể hủy: '+r.error};
  v.status='void';
  v.voidedBy=SESSION?SESSION.username:'hệ thống';
  v.voidedAt=nowISO();
  audit('Hủy phiếu', VTYPES[v.type].name+' '+v.code);
  saveDB();
  return {ok:true};
}

/* Xóa phiếu vĩnh viễn: nếu phiếu đang ghi sổ thì hoàn tác tồn kho trước, rồi xóa khỏi lịch sử */
function deleteVoucher(id){
  var v=DB.vouchers.find(function(x){return x.id===id;});
  if(!v) return {ok:false, error:'Không tìm thấy phiếu'};
  if(v.status!=='void'){
    var r=applyReversal(v);
    if(!r.ok) return {ok:false, error:'Không thể xóa: '+r.error};
  }
  DB.vouchers=DB.vouchers.filter(function(x){return x.id!==id;});
  audit('Xóa phiếu', VTYPES[v.type].name+' '+v.code+' — '+v.lines.length+' dòng, tổng '+fmtMoney(v.total)+' đ'+(v.status==='void'?' (phiếu đã hủy từ trước)':' (đã hoàn tác tồn kho trước khi xóa)'));
  saveDB();
  return {ok:true};
}

/* ==================== CÔNG NỢ & PHIẾU THU / CHI ====================
 Quy ước dấu (theo góc nhìn CỦA TA):
 - NCC   (phải trả): nhập +(total−paid) · trả hàng NCC −(total−paid) · phiếu chi −amount · phiếu thu +amount
 - Khách (phải thu): xuất +(total−paid) · khách trả hàng −(total−paid) · phiếu thu −amount · phiếu chi +amount
 Số dương = đối tác đang nợ theo chiều thông thường; số âm = trả thừa / hoàn ngược.
 Phiếu đã hủy (status='void') không tính. paid trên phiếu trả hàng = tiền đã hoàn ngay khi trả. */
function nextPayCode(type){
  var key='pay_'+type;
  var c=DB.counters[key]||1;
  DB.counters[key]=c+1;
  return PTYPES[type].code + String(c).padStart(5,'0');
}
function voucherDebtDelta(v){
  if(v.status==='void' || !v.partnerId || !isMoneyVoucher(v.type)) return 0;
  var paid=(v.paid===undefined)?(v.total||0):v.paid;
  var d=round2((v.total||0)-paid);
  return (v.type==='in'||v.type==='out') ? d : -d;
}
function paymentDebtDelta(pm, partnerType){
  if(pm.status==='void') return 0;
  if(partnerType==='supplier') return pm.type==='payment' ? -pm.amount : pm.amount;
  return pm.type==='receipt' ? -pm.amount : pm.amount;
}
function postPayment(inp){
  var pt=PTYPES[inp.type];
  if(!pt) return {ok:false, error:'Loại phiếu thu/chi không hợp lệ'};
  var partner=partnerById(inp.partnerId);
  if(!partner) return {ok:false, error:'Chưa chọn đối tác'};
  var amount=round2(parseNum(inp.amount));
  if(!(amount>0)) return {ok:false, error:'Số tiền phải lớn hơn 0'};
  var pm={
    id:uid(), code:nextPayCode(inp.type), type:inp.type,
    date:(inp.date||todayStr()).slice(0,10),
    partnerId:partner.id, amount:amount,
    method:inp.method==='bank'?'bank':'cash',
    note:inp.note||'', status:'posted',
    createdBy:SESSION?SESSION.username:'hệ thống', createdAt:nowISO()
  };
  DB.payments.unshift(pm);
  audit('Tạo phiếu', pt.name+' '+pm.code+' — '+partner.name+': '+fmtMoney(amount)+' đ');
  saveDB();
  return {ok:true, payment:pm};
}
function voidPayment(id){
  var pm=DB.payments.find(function(x){return x.id===id;});
  if(!pm) return {ok:false, error:'Không tìm thấy phiếu'};
  if(pm.status==='void') return {ok:false, error:'Phiếu này đã hủy trước đó'};
  pm.status='void';
  pm.voidedBy=SESSION?SESSION.username:'hệ thống';
  pm.voidedAt=nowISO();
  audit('Hủy phiếu', PTYPES[pm.type].name+' '+pm.code);
  saveDB();
  return {ok:true};
}
function deletePayment(id){
  var pm=DB.payments.find(function(x){return x.id===id;});
  if(!pm) return {ok:false, error:'Không tìm thấy phiếu'};
  DB.payments=DB.payments.filter(function(x){return x.id!==id;});
  audit('Xóa phiếu', PTYPES[pm.type].name+' '+pm.code+' — '+partnerName(pm.partnerId)+': '+fmtMoney(pm.amount)+' đ');
  saveDB();
  return {ok:true};
}
/* Công nợ hiện tại của 1 đối tác */
function partnerDebt(partnerId){
  var partner=partnerById(partnerId); if(!partner) return 0;
  var d=0;
  DB.vouchers.forEach(function(v){ if(v.partnerId===partnerId) d+=voucherDebtDelta(v); });
  DB.payments.forEach(function(pm){ if(pm.partnerId===partnerId) d+=paymentDebtDelta(pm, partner.type); });
  return round2(d);
}
/* Bảng tổng hợp công nợ theo loại đối tác ('supplier'|'customer') */
function debtSummary(type){
  var rows=[];
  DB.partners.filter(function(p){return p.type===type;}).forEach(function(p){
    var gross=0, returned=0, paidNet=0, has=false;
    DB.vouchers.forEach(function(v){
      if(v.partnerId!==p.id || v.status==='void' || !isMoneyVoucher(v.type)) return;
      has=true;
      var paid=(v.paid===undefined)?(v.total||0):v.paid;
      if(v.type==='in'||v.type==='out'){ gross+=(v.total||0); paidNet+=paid; }
      else { returned+=(v.total||0); paidNet-=paid; }
    });
    DB.payments.forEach(function(pm){
      if(pm.partnerId!==p.id || pm.status==='void') return;
      has=true;
      paidNet += (type==='supplier') ? (pm.type==='payment'?pm.amount:-pm.amount)
                                     : (pm.type==='receipt'?pm.amount:-pm.amount);
    });
    var balance=round2(gross-returned-paidNet);
    if(has) rows.push({partner:p, gross:round2(gross), returned:round2(returned), paidNet:round2(paidNet), balance:balance});
  });
  rows.sort(function(a,b){ return b.balance-a.balance; });
  return rows;
}
/* Sổ chi tiết công nợ 1 đối tác: các dòng phát sinh theo thời gian + số dư lũy kế */
function partnerStatement(partnerId){
  var p=partnerById(partnerId); if(!p) return [];
  var entries=[];
  DB.vouchers.forEach(function(v){
    if(v.partnerId!==partnerId || v.status==='void' || !isMoneyVoucher(v.type)) return;
    entries.push({date:v.date, time:v.createdAt||'', code:v.code, kind:'voucher', id:v.id,
      label:VTYPES[v.type].icon+' '+VTYPES[v.type].name, total:v.total||0,
      paid:(v.paid===undefined)?(v.total||0):v.paid, delta:voucherDebtDelta(v)});
  });
  DB.payments.forEach(function(pm){
    if(pm.partnerId!==partnerId || pm.status==='void') return;
    entries.push({date:pm.date, time:pm.createdAt||'', code:pm.code, kind:'payment', id:pm.id,
      label:PTYPES[pm.type].icon+' '+PTYPES[pm.type].name+(pm.method==='bank'?' (CK)':' (TM)'), total:pm.amount,
      paid:null, delta:paymentDebtDelta(pm, p.type)});
  });
  entries.sort(function(a,b){ return a.date===b.date ? (a.time<b.time?-1:1) : (a.date<b.date?-1:1); });
  var bal=0;
  entries.forEach(function(e){ bal=round2(bal+e.delta); e.balance=bal; });
  return entries;
}
/* Tổng phải thu / phải trả (chỉ cộng số dương — trả thừa xem ở từng đối tác) */
function totalReceivable(){ var s=0; debtSummary('customer').forEach(function(r){ if(r.balance>0) s+=r.balance; }); return round2(s); }
function totalPayable(){ var s=0; debtSummary('supplier').forEach(function(r){ if(r.balance>0) s+=r.balance; }); return round2(s); }

/* ---------- Cảnh báo tồn thấp ---------- */
function lowStockProducts(){
  return activeProducts()
    .filter(function(p){ return (p.minStock||0)>0 && totalStock(p.id) < p.minStock; })
    .sort(function(a,b){ return (totalStock(a.id)/a.minStock) - (totalStock(b.id)/b.minStock); });
}

/* ---------- Báo cáo Nhập-Xuất-Tồn ---------- */
function reportNXT(from, to, whId){
  var rows={};
  DB.products.forEach(function(p){
    rows[p.id]={ product:p, openQ:0, inQ:0, inV:0, outQ:0, outV:0 };
  });
  DB.vouchers.forEach(function(v){
    if(v.status==='void') return;
    if(!whId && v.type==='transfer') return; // phạm vi toàn công ty: chuyển nội bộ không tính
    v.lines.forEach(function(l){
      var r=rows[l.productId]; if(!r) return;
      var effects=[];
      if(v.type==='in')             effects.push({wh:v.warehouseId, dq:+l.qty, val:l.qty*l.price, dir:'in'});
      else if(v.type==='return_cus')effects.push({wh:v.warehouseId, dq:+l.qty, val:l.qty*l.cost,  dir:'in'});
      else if(v.type==='out')       effects.push({wh:v.warehouseId, dq:-l.qty, val:l.qty*l.cost,  dir:'out'});
      else if(v.type==='return_sup')effects.push({wh:v.warehouseId, dq:-l.qty, val:l.qty*l.cost,  dir:'out'});
      else if(v.type==='transfer'){
        effects.push({wh:v.warehouseId,   dq:-l.qty, val:l.qty*l.cost, dir:'out'});
        effects.push({wh:v.toWarehouseId, dq:+l.qty, val:l.qty*l.cost, dir:'in'});
      }
      else if(v.type==='adjust'){
        effects.push({wh:v.warehouseId, dq:l.qty, val:Math.abs(l.qty)*l.cost, dir:(l.qty>=0?'in':'out')});
      }
      effects.forEach(function(e){
        if(whId && e.wh!==whId) return;
        if(v.date<from){ r.openQ=round3(r.openQ+e.dq); }
        else if(v.date<=to){
          if(e.dir==='in'){ r.inQ=round3(r.inQ+Math.abs(e.dq)); r.inV+=e.val; }
          else { r.outQ=round3(r.outQ+Math.abs(e.dq)); r.outV+=e.val; }
        }
      });
    });
  });
  var out=[];
  for(var pid in rows){
    var r=rows[pid];
    r.closeQ=round3(r.openQ + r.inQ - r.outQ);
    if(r.openQ||r.inQ||r.outQ||r.closeQ) out.push(r);
  }
  out.sort(function(a,b){ return a.product.name.localeCompare(b.product.name,'vi'); });
  return out;
}

/* ---------- Báo cáo lợi nhuận (doanh thu bán hàng - giá vốn, trừ hàng khách trả) ---------- */
function reportProfit(from, to){
  var rows={};
  function row(pid){
    if(!rows[pid]){
      var p=prodById(pid);
      rows[pid]={ product:p, soldQ:0, returnQ:0, revenue:0, cogs:0 };
    }
    return rows[pid];
  }
  DB.vouchers.forEach(function(v){
    if(v.status==='void') return;
    if(v.date<from || v.date>to) return;
    if(v.type==='out'){
      v.lines.forEach(function(l){
        var r=row(l.productId); if(!r.product) return;
        r.soldQ=round3(r.soldQ+l.qty); r.revenue+=l.qty*l.price; r.cogs+=l.qty*l.cost;
      });
    } else if(v.type==='return_cus'){
      v.lines.forEach(function(l){
        var r=row(l.productId); if(!r.product) return;
        r.returnQ=round3(r.returnQ+l.qty); r.revenue-=l.qty*l.price; r.cogs-=l.qty*l.cost;
      });
    }
  });
  var out=[], sum={revenue:0, cogs:0, profit:0, soldQ:0, returnQ:0};
  for(var pid in rows){
    var r=rows[pid];
    if(!r.product) continue;
    if(!r.soldQ && !r.returnQ) continue;
    r.netQ=round3(r.soldQ-r.returnQ);
    r.profit=r.revenue-r.cogs;
    r.margin=r.revenue>0 ? (r.profit/r.revenue*100) : 0;
    sum.revenue+=r.revenue; sum.cogs+=r.cogs; sum.profit+=r.profit;
    sum.soldQ=round3(sum.soldQ+r.soldQ); sum.returnQ=round3(sum.returnQ+r.returnQ);
    out.push(r);
  }
  out.sort(function(a,b){ return b.revenue-a.revenue; });
  sum.margin=sum.revenue>0 ? (sum.profit/sum.revenue*100) : 0;
  return {rows:out, sum:sum};
}

/* ---------- Số liệu bảng điều khiển ---------- */
function dashStats(){
  var t=todayStr();
  var todayVs=DB.vouchers.filter(function(v){ return v.status!=='void' && v.date===t; });
  var inToday=todayVs.filter(function(v){return v.type==='in';});
  var outToday=todayVs.filter(function(v){return v.type==='out';});
  var days=[];
  for(var i=6;i>=0;i--){
    var d=dayOffset(-i), inV=0, outV=0;
    DB.vouchers.forEach(function(v){
      if(v.status==='void'||v.date!==d) return;
      if(v.type==='in') inV+=v.total;
      else if(v.type==='out') outV+=v.total;
    });
    days.push({date:d, inV:inV, outV:outV});
  }
  return {
    skuCount:activeProducts().length,
    stockValue:stockValueTotal(),
    lowList:lowStockProducts(),
    inTodayCount:inToday.length, inTodayVal:inToday.reduce(function(s,v){return s+v.total;},0),
    outTodayCount:outToday.length, outTodayVal:outToday.reduce(function(s,v){return s+v.total;},0),
    days:days
  };
}
</script>

<script>
'use strict';
/* ==================== SHELL: NAV, MODAL, TOAST, AUTH ==================== */

/* ---------- Toast ---------- */
function toast(msg, type){
  var root=$('#toast-root'); if(!root) return;
  var el=document.createElement('div');
  el.className='toast '+(type||'info');
  var ic = type==='success'?'✅': type==='error'?'⛔': type==='warn'?'⚠️':'ℹ️';
  el.innerHTML='<span>'+ic+'</span><span>'+esc(msg)+'</span>';
  root.appendChild(el);
  setTimeout(function(){ el.style.opacity='0'; el.style.transition='opacity .3s'; setTimeout(function(){ el.remove(); },320); }, type==='error'?5200:3400);
}

/* ---------- Modal ---------- */
function openModal(opt){
  var root=$('#modal-root'), box=$('#modal-box');
  box.innerHTML=
    '<div class="modal '+(opt.size||'md')+'">'+
      '<div class="modal-head"><b>'+esc(opt.title||'')+'</b><button class="modal-x" onclick="closeModal()">✕</button></div>'+
      '<div class="modal-body">'+(opt.body||'')+'</div>'+
      (opt.footer!==false ? '<div class="modal-foot" id="modal-foot">'+(opt.footer||'<button class="btn btn-ghost" onclick="closeModal()">Đóng</button>')+'</div>' : '')+
    '</div>';
  root.classList.add('open');
  if(opt.onOpen) opt.onOpen();
}
function closeModal(){ $('#modal-root').classList.remove('open'); $('#modal-box').innerHTML=''; }
var _confirmCb=null;
function confirmDlg(title, msg, okLabel, cb, danger){
  _confirmCb=cb;
  openModal({
    title:title, size:'sm',
    body:'<div style="font-size:14px;line-height:1.7">'+msg+'</div>',
    footer:'<button class="btn btn-ghost" onclick="closeModal()">Không</button>'+
           '<button class="btn '+(danger?'btn-danger':'btn-primary')+'" onclick="runConfirm()">'+esc(okLabel||'Đồng ý')+'</button>'
  });
}
function runConfirm(){ var cb=_confirmCb; _confirmCb=null; closeModal(); if(cb) cb(); }

/* ---------- Trang & điều hướng ---------- */
var RENDERERS={};
var CURRENT_PAGE='dashboard';
var PAGES=[
  {group:'TỔNG QUAN'},
  {id:'dashboard',  icon:'📊', title:'Bảng điều khiển'},
  {group:'DANH MỤC'},
  {id:'products',   icon:'📦', title:'Sản phẩm'},
  {id:'partners',   icon:'🤝', title:'Đối tác'},
  {id:'warehouses', icon:'🏬', title:'Kho hàng', roles:['admin','manager']},
  {group:'NGHIỆP VỤ'},
  {id:'stockin',    icon:'📥', title:'Nhập kho'},
  {id:'stockout',   icon:'📤', title:'Xuất kho'},
  {id:'transfer',   icon:'🔁', title:'Chuyển kho'},
  {id:'returns',    icon:'↩️', title:'Trả hàng'},
  {id:'finance',    icon:'💳', title:'Thu chi & Công nợ'},
  {id:'stocktake',  icon:'📋', title:'Kiểm kê', roles:['admin','manager']},
  {group:'THEO DÕI'},
  {id:'inventory',  icon:'🗃️', title:'Tồn kho'},
  {id:'history',    icon:'🕘', title:'Lịch sử phiếu'},
  {id:'reports',    icon:'📈', title:'Báo cáo', roles:['admin','manager']},
  {group:'HỆ THỐNG'},
  {id:'users',      icon:'👥', title:'Người dùng', roles:['admin']},
  {id:'auditlog',   icon:'📜', title:'Nhật ký thao tác', roles:['admin','manager']},
  {id:'system',     icon:'💾', title:'Sao lưu & Cài đặt', roles:['admin']}
];
function can(pageId){
  var pg=PAGES.find(function(p){return p.id===pageId;});
  if(!pg) return false;
  if(!pg.roles) return true;
  return !!SESSION && pg.roles.indexOf(SESSION.role)>=0;
}
function buildNav(){
  var html='';
  PAGES.forEach(function(p){
    if(p.group){ html+='<div class="nav-group">'+p.group+'</div>'; return; }
    if(!can(p.id)) return;
    html+='<div class="nav-item" id="nav-'+p.id+'" onclick="showPage(\''+p.id+'\')"><span class="ic">'+p.icon+'</span><span class="tx">'+p.title+'</span></div>';
  });
  $('#nav').innerHTML=html;
}
function showPage(id, arg){
  if(!can(id)){ toast('Bạn không có quyền truy cập mục này','warn'); return; }
  CURRENT_PAGE=id;
  var pg=PAGES.find(function(p){return p.id===id;});
  $('#page-title').textContent=pg?pg.title:'';
  $$('#nav .nav-item').forEach(function(el){ el.classList.toggle('active', el.id==='nav-'+id); });
  var fn=RENDERERS[id];
  var c=$('#content');
  c.scrollTop=0;
  if(fn) fn(c, arg);
  else c.innerHTML='<div class="card">Đang xây dựng…</div>';
}
function refreshPage(){ showPage(CURRENT_PAGE); }

/* ---------- Menu người dùng ---------- */
function toggleUserMenu(e){
  e.stopPropagation();
  $('#user-menu').classList.toggle('hidden');
}
document.addEventListener('click', function(e){
  var m=$('#user-menu');
  if(m && !m.classList.contains('hidden') && !e.target.closest('.user-chip') && !e.target.closest('#user-menu')) m.classList.add('hidden');
});

/* ---------- Đăng nhập / Đăng xuất ---------- */
function doLogin(){
  var un=($('#login-user').value||'').trim().toLowerCase();
  var pw=$('#login-pass').value||'';
  var err=$('#login-err');
  var u=DB.users.find(function(x){ return x.username.toLowerCase()===un; });
  if(!u || u.passHash!==hashPass(pw)){
    err.textContent='Sai tên đăng nhập hoặc mật khẩu.'; err.classList.remove('hidden');
    audit('Đăng nhập thất bại','Tài khoản: '+un); saveDB();
    return;
  }
  if(u.active===false){
    err.textContent='Tài khoản này đã bị khóa. Liên hệ quản trị viên.'; err.classList.remove('hidden');
    return;
  }
  err.classList.add('hidden');
  SESSION=u;
  try{ sessionStorage.setItem('qlk_session', u.id); }catch(e){}
  audit('Đăng nhập',''); saveDB();
  enterApp();
}
function doLogout(msg){
  if(SESSION){ audit('Đăng xuất',''); saveDB(); }
  SESSION=null;
  try{ sessionStorage.removeItem('qlk_session'); }catch(e){}
  $('#user-menu').classList.add('hidden');
  $('#app').classList.add('hidden');
  $('#login-screen').classList.remove('hidden');
  $('#login-pass').value='';
  if(typeof msg==='string' && msg){ var er=$('#login-err'); er.textContent=msg; er.classList.remove('hidden'); }
}
function enterApp(){
  $('#login-screen').classList.add('hidden');
  $('#app').classList.remove('hidden');
  var name=SESSION.fullName||SESSION.username;
  $('#user-name').textContent=name;
  $('#user-role').textContent=ROLES[SESSION.role]||SESSION.role;
  $('#user-avatar').textContent=name.trim().charAt(0).toUpperCase();
  buildNav();
  showPage('dashboard');
}
function changePassModal(){
  $('#user-menu').classList.add('hidden');
  openModal({
    title:'Đổi mật khẩu', size:'sm',
    body:
      '<div class="field"><label>Mật khẩu hiện tại</label><input type="password" id="cp-old"></div>'+
      '<div class="field"><label>Mật khẩu mới (tối thiểu 4 ký tự)</label><input type="password" id="cp-new"></div>'+
      '<div class="field"><label>Nhập lại mật khẩu mới</label><input type="password" id="cp-new2"></div>',
    footer:'<button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="doChangePass()">Lưu mật khẩu</button>'
  });
}
function doChangePass(){
  var o=$('#cp-old').value, n=$('#cp-new').value, n2=$('#cp-new2').value;
  if(SESSION.passHash!==hashPass(o)) return toast('Mật khẩu hiện tại không đúng','error');
  if(n.length<4) return toast('Mật khẩu mới phải có ít nhất 4 ký tự','error');
  if(n!==n2) return toast('Mật khẩu nhập lại không khớp','error');
  SESSION.passHash=hashPass(n);
  audit('Đổi mật khẩu',''); saveDB();
  closeModal(); toast('Đã đổi mật khẩu thành công','success');
}

/* ---------- Cập nhật tên công ty trên giao diện ---------- */
function applySettingsUI(){
  var name=(DB.settings.companyName||'').trim();
  $('#brand-company').textContent=name||'Nội bộ';
  $('#login-company').textContent=name||'Phần mềm quản lý kho nội bộ';
}

/* ---------- Khởi động ---------- */
function boot(){
  storageOK=storageAvailable();
  if(!storageOK) $('#storage-warn').classList.remove('hidden');
  DB=loadDB();
  if(!DB){
    DB=defaultDB();
    seedDemo();
    saveDB();
  }
  applySettingsUI();
  // Enter để đăng nhập
  ['#login-user','#login-pass'].forEach(function(s){
    $(s).addEventListener('keydown', function(e){ if(e.key==='Enter') doLogin(); });
  });
  // Khôi phục phiên
  var sid=null;
  try{ sid=sessionStorage.getItem('qlk_session'); }catch(e){}
  var u=sid ? DB.users.find(function(x){return x.id===sid && x.active!==false;}) : null;
  if(u){ SESSION=u; enterApp(); }
}
document.addEventListener('DOMContentLoaded', boot);
</script>

<script>
'use strict';
/* ==================== DANH MỤC: SẢN PHẨM / ĐỐI TÁC / KHO / NGƯỜI DÙNG ==================== */

/* ---------- SẢN PHẨM ---------- */
var PRODF={q:'', cat:'', showInactive:false};
RENDERERS.products=function(c){
  var mgr=isMgr();
  c.innerHTML=
  '<div class="toolbar">'+
    '<div class="field grow"><label>Tìm kiếm</label><input id="pf-q" placeholder="Tên, mã hoặc hãng…" value="'+esc(PRODF.q)+'"></div>'+
    '<div class="field"><label>Nhóm hàng</label><select id="pf-cat" onchange="prodFilter()">'+catOptions(PRODF.cat,true)+'</select></div>'+
    '<div class="field"><label>&nbsp;</label><label style="display:flex;align-items:center;gap:6px;font-weight:500;margin:0;padding:8px 0"><input type="checkbox" id="pf-inactive" '+(PRODF.showInactive?'checked':'')+' onchange="prodFilter()"> Hiện hàng ngừng KD</label></div>'+
    '<div class="toolbar-right">'+
      (mgr?'<button class="btn btn-ghost btn-sm" onclick="categoriesModal()">🏷️ Nhóm hàng</button>':'')+
      (mgr?'<button class="btn btn-ghost btn-sm" onclick="importProducts()">📄 Nhập Excel</button>':'')+
      '<button class="btn btn-ghost btn-sm" onclick="exportProducts()">📊 Xuất Excel</button>'+
      (mgr?'<button class="btn btn-primary btn-sm" onclick="productForm()">＋ Thêm sản phẩm</button>':'')+
    '</div>'+
  '</div>'+
  '<div class="tbl-wrap tbl-scroll"><table class="tbl"><thead><tr>'+
    '<th>Mã</th><th>Tên sản phẩm</th><th>Hãng</th><th>Nhóm</th><th>ĐVT</th><th class="r">Giá vốn</th><th class="r">Giá bán</th><th class="r">Tổng tồn</th><th class="r">Tồn min</th><th class="c">Trạng thái</th>'+(mgr?'<th class="c">Thao tác</th>':'')+
  '</tr></thead><tbody id="prod-tbody"></tbody></table></div>'+
  '<div class="pagin" id="prod-count"></div>';
  $('#pf-q').addEventListener('input', prodFilter);
  prodRows();
};
function catOptions(sel, withAll){
  var html=withAll?'<option value="">— Tất cả nhóm —</option>':'<option value="">— Không nhóm —</option>';
  DB.categories.forEach(function(cg){ html+='<option value="'+cg.id+'" '+(sel===cg.id?'selected':'')+'>'+esc(cg.name)+'</option>'; });
  return html;
}
function prodFilter(){
  PRODF.q=$('#pf-q').value; PRODF.cat=$('#pf-cat').value; PRODF.showInactive=$('#pf-inactive').checked;
  prodRows();
}
function prodRows(){
  var mgr=isMgr();
  var q=normStr(PRODF.q);
  var list=DB.products.filter(function(p){
    if(!PRODF.showInactive && p.active===false) return false;
    if(PRODF.cat && p.categoryId!==PRODF.cat) return false;
    if(q && normStr(p.name).indexOf(q)<0 && normStr(p.sku).indexOf(q)<0 && normStr(p.brand).indexOf(q)<0) return false;
    return true;
  }).sort(function(a,b){ return a.sku.localeCompare(b.sku,'vi'); });
  var shown=list.slice(0,400);
  var html=shown.map(function(p){
    var ts=totalStock(p.id);
    var low=(p.minStock||0)>0 && ts<p.minStock;
    return '<tr>'+
      '<td><b>'+esc(p.sku)+'</b></td>'+
      '<td>'+esc(p.name)+(p.note?'<div class="small muted">'+esc(p.note)+'</div>':'')+'</td>'+
      '<td>'+(p.brand?esc(p.brand):'<span style="color:var(--muted2)">—</span>')+'</td>'+
      '<td>'+(p.categoryId?'<span class="tag">'+esc(catName(p.categoryId))+'</span>':'')+'</td>'+
      '<td>'+esc(p.unit)+'</td>'+
      '<td class="r">'+fmtMoney(p.costPrice)+'</td>'+
      '<td class="r">'+fmtMoney(p.salePrice)+'</td>'+
      '<td class="r '+(low?'low-flag':'')+'">'+fmtQty(ts)+(low?' ⚠️':'')+'</td>'+
      '<td class="r muted">'+(p.minStock?fmtQty(p.minStock):'—')+'</td>'+
      '<td class="c">'+(p.active===false?'<span class="tag tag-gray">Ngừng KD</span>':'<span class="tag tag-green">Đang bán</span>')+'</td>'+
      (mgr?'<td class="c" style="white-space:nowrap"><button class="btn btn-xs btn-ghost" onclick="productForm(\''+p.id+'\')">Sửa</button> <button class="btn btn-xs btn-danger" onclick="deleteProduct(\''+p.id+'\')">Xóa</button></td>':'')+
    '</tr>';
  }).join('');
  $('#prod-tbody').innerHTML=html||'<tr><td colspan="11"><div class="empty">Chưa có sản phẩm nào. '+(mgr?'Bấm “＋ Thêm sản phẩm” hoặc “Nhập Excel” để bắt đầu.':'')+'</div></td></tr>';
  $('#prod-count').textContent='Hiển thị '+shown.length+' / '+list.length+' sản phẩm';
}
function productForm(id){
  if(!isMgr()) return;
  var p=id?prodById(id):null;
  var hasStock=p?totalStock(p.id)>0:false;
  openModal({
    title:p?'Sửa sản phẩm — '+p.sku:'Thêm sản phẩm mới', size:'md',
    body:
    '<div class="form-grid">'+
      '<div class="field"><label>Mã sản phẩm (SKU) <span class="req">*</span></label><input id="prf-sku" value="'+esc(p?p.sku:suggestSku())+'"></div>'+
      '<div class="field"><label>Tên sản phẩm <span class="req">*</span></label><input id="prf-name" value="'+esc(p?p.name:'')+'"></div>'+
      '<div class="field"><label>Hãng / Thương hiệu</label><input id="prf-brand" value="'+esc(p?p.brand:'')+'" placeholder="Logitech, Thiên Long…"></div>'+
      '<div class="field"><label>Nhóm hàng</label><select id="prf-cat">'+catOptions(p?p.categoryId:'')+'</select></div>'+
      '<div class="field"><label>Đơn vị tính <span class="req">*</span></label><input id="prf-unit" value="'+esc(p?p.unit:'cái')+'" placeholder="cái, hộp, kg…"></div>'+
      '<div class="field"><label>Giá vốn (đ)'+(hasStock&&!isAdmin()?' <span class="small muted">(tự động theo BQGQ)</span>':'')+'</label><input type="number" min="0" step="any" id="prf-cost" value="'+(p?p.costPrice||0:0)+'" '+(hasStock&&!isAdmin()?'disabled':'')+'></div>'+
      '<div class="field"><label>Giá bán (đ)</label><input type="number" min="0" step="any" id="prf-sale" value="'+(p?p.salePrice||0:0)+'"></div>'+
      '<div class="field"><label>Tồn tối thiểu (cảnh báo)</label><input type="number" min="0" step="any" id="prf-min" value="'+(p?p.minStock||0:0)+'"></div>'+
      (p?'<div class="field"><label>Trạng thái</label><select id="prf-active"><option value="1" '+(p.active!==false?'selected':'')+'>Đang kinh doanh</option><option value="0" '+(p.active===false?'selected':'')+'>Ngừng kinh doanh</option></select></div>':'')+
    '</div>'+
    '<div class="field"><label>Ghi chú</label><input id="prf-note" value="'+esc(p?p.note:'')+'"></div>'+
    (hasStock?'<div class="small muted">⚠️ Sản phẩm đang có tồn kho ('+fmtQty(totalStock(p.id))+' '+esc(p.unit)+'). Giá vốn thường được cập nhật tự động theo bình quân gia quyền khi nhập kho'+(isAdmin()?'; quản trị viên vẫn có thể sửa tay nếu cần.':'.')+'</div>':''),
    footer:'<button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveProduct(\''+(p?p.id:'')+'\')">Lưu sản phẩm</button>'
  });
}
function suggestSku(){
  var n=DB.products.length+1, sku;
  do{ sku='SP'+String(n).padStart(4,'0'); n++; }while(DB.products.some(function(p){return p.sku===sku;}));
  return sku;
}
function saveProduct(id){
  var sku=($('#prf-sku').value||'').trim().toUpperCase();
  var name=($('#prf-name').value||'').trim();
  var unit=($('#prf-unit').value||'').trim()||'cái';
  if(!sku) return toast('Nhập mã sản phẩm','error');
  if(!name) return toast('Nhập tên sản phẩm','error');
  if(DB.products.some(function(p){ return p.sku.toUpperCase()===sku && p.id!==id; })) return toast('Mã "'+sku+'" đã tồn tại, hãy dùng mã khác','error');
  var costEl=$('#prf-cost');
  var data={
    sku:sku, name:name, unit:unit,
    brand:($('#prf-brand').value||'').trim(),
    categoryId:$('#prf-cat').value||null,
    salePrice:parseNum($('#prf-sale').value),
    minStock:parseNum($('#prf-min').value),
    note:($('#prf-note').value||'').trim()
  };
  if(id){
    var p=prodById(id);
    var oldCost=p.costPrice;
    Object.assign(p,data);
    if(!costEl.disabled){
      var nc=parseNum(costEl.value);
      if(nc!==oldCost){ p.costPrice=nc; audit('Sửa giá vốn thủ công', p.sku+' — '+p.name+': '+fmtMoney(oldCost)+' → '+fmtMoney(nc)+' đ'); }
    }
    p.active=$('#prf-active')?$('#prf-active').value==='1':p.active;
    audit('Sửa sản phẩm', p.sku+' — '+p.name);
  } else {
    data.id=uid(); data.costPrice=parseNum(costEl.value); data.active=true; data.createdAt=nowISO();
    DB.products.push(data);
    audit('Thêm sản phẩm', data.sku+' — '+data.name);
  }
  saveDB(); closeModal(); toast('Đã lưu sản phẩm','success');
  if(CURRENT_PAGE==='products') prodRows();
}
function deleteProduct(id){
  if(!isMgr()) return;
  var p=prodById(id); if(!p) return;
  var used=DB.vouchers.some(function(v){ return v.lines.some(function(l){return l.productId===id;}); });
  var st=totalStock(id);
  if(used || st>0){
    confirmDlg('Không thể xóa','Sản phẩm <b>'+esc(p.name)+'</b> '+(st>0?'đang còn tồn kho ('+fmtQty(st)+' '+esc(p.unit)+')':'đã phát sinh phiếu nhập/xuất')+', không thể xóa để bảo toàn dữ liệu.<br><br>Bạn có muốn chuyển sang trạng thái <b>Ngừng kinh doanh</b> không?','Ngừng kinh doanh',function(){
      p.active=false; audit('Ngừng kinh doanh', p.sku+' — '+p.name); saveDB(); toast('Đã chuyển "'+p.name+'" sang ngừng kinh doanh','success'); prodRows();
    });
    return;
  }
  confirmDlg('Xóa sản phẩm','Xóa vĩnh viễn sản phẩm <b>'+esc(p.name)+'</b> ('+esc(p.sku)+')?','Xóa',function(){
    DB.products=DB.products.filter(function(x){return x.id!==id;});
    audit('Xóa sản phẩm', p.sku+' — '+p.name); saveDB(); toast('Đã xóa sản phẩm','success'); prodRows();
  }, true);
}

/* ---------- NHÓM HÀNG ---------- */
function categoriesModal(){
  if(!isMgr()) return;
  var rows=DB.categories.map(function(cg){
    var count=DB.products.filter(function(p){return p.categoryId===cg.id;}).length;
    return '<tr><td><input id="cat-n-'+cg.id+'" value="'+esc(cg.name)+'"></td><td class="c muted">'+count+' SP</td>'+
      '<td class="c" style="white-space:nowrap"><button class="btn btn-xs btn-ghost" onclick="catRename(\''+cg.id+'\')">Lưu</button> <button class="btn btn-xs btn-danger" onclick="catDelete(\''+cg.id+'\')">Xóa</button></td></tr>';
  }).join('');
  openModal({
    title:'Quản lý nhóm hàng', size:'sm',
    body:
      '<div style="display:flex;gap:8px;margin-bottom:14px"><input id="cat-new" placeholder="Tên nhóm hàng mới…"><button class="btn btn-primary btn-sm" onclick="catAdd()">Thêm</button></div>'+
      (rows?'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tên nhóm</th><th class="c">Số SP</th><th class="c">Thao tác</th></tr></thead><tbody>'+rows+'</tbody></table></div>':'<div class="empty">Chưa có nhóm hàng nào</div>')
  });
}
function catAdd(){
  var name=($('#cat-new').value||'').trim();
  if(!name) return toast('Nhập tên nhóm hàng','error');
  if(DB.categories.some(function(c){return normStr(c.name)===normStr(name);})) return toast('Nhóm này đã tồn tại','error');
  DB.categories.push({id:uid(), name:name});
  audit('Thêm nhóm hàng', name); saveDB(); toast('Đã thêm nhóm "'+name+'"','success'); categoriesModal();
}
function catRename(id){
  var c=catById(id); if(!c) return;
  var name=($('#cat-n-'+id).value||'').trim();
  if(!name) return toast('Tên nhóm không được trống','error');
  audit('Sửa nhóm hàng', c.name+' → '+name);
  c.name=name; saveDB(); toast('Đã cập nhật nhóm hàng','success'); categoriesModal();
}
function catDelete(id){
  var c=catById(id); if(!c) return;
  var count=DB.products.filter(function(p){return p.categoryId===id;}).length;
  confirmDlg('Xóa nhóm hàng','Xóa nhóm <b>'+esc(c.name)+'</b>?'+(count?' '+count+' sản phẩm thuộc nhóm này sẽ chuyển về “Không nhóm”.':''),'Xóa',function(){
    DB.products.forEach(function(p){ if(p.categoryId===id) p.categoryId=null; });
    DB.categories=DB.categories.filter(function(x){return x.id!==id;});
    audit('Xóa nhóm hàng', c.name); saveDB(); toast('Đã xóa nhóm hàng','success'); categoriesModal();
    if(CURRENT_PAGE==='products') prodRows();
  }, true);
}

/* ---------- ĐỐI TÁC ---------- */
var PARTF={tab:'supplier', q:''};
RENDERERS.partners=function(c){
  var mgr=isMgr();
  c.innerHTML=
  '<div class="tabs">'+
    '<div class="tab '+(PARTF.tab==='supplier'?'active':'')+'" onclick="PARTF.tab=\'supplier\';refreshPage()">🚚 Nhà cung cấp</div>'+
    '<div class="tab '+(PARTF.tab==='customer'?'active':'')+'" onclick="PARTF.tab=\'customer\';refreshPage()">🛒 Khách hàng</div>'+
  '</div>'+
  '<div class="toolbar">'+
    '<div class="field grow"><label>Tìm kiếm</label><input id="ptf-q" placeholder="Tên, mã, điện thoại…" value="'+esc(PARTF.q)+'"></div>'+
    '<div class="toolbar-right">'+
      (mgr?'<button class="btn btn-ghost btn-sm" onclick="importPartners()">📄 Nhập Excel</button>':'')+
      '<button class="btn btn-ghost btn-sm" onclick="exportPartners()">📊 Xuất Excel</button>'+
      (mgr?'<button class="btn btn-primary btn-sm" onclick="partnerForm(\''+PARTF.tab+'\')">＋ Thêm '+(PARTF.tab==='supplier'?'nhà cung cấp':'khách hàng')+'</button>':'')+
    '</div>'+
  '</div>'+
  '<div class="tbl-wrap tbl-scroll"><table class="tbl"><thead><tr>'+
    '<th>Mã</th><th>Tên</th><th>Điện thoại</th><th>Địa chỉ</th><th>MST</th><th class="c">Trạng thái</th>'+(mgr?'<th class="c">Thao tác</th>':'')+
  '</tr></thead><tbody id="pt-tbody"></tbody></table></div>';
  $('#ptf-q').addEventListener('input', function(){ PARTF.q=this.value; partnerRows(); });
  partnerRows();
};
function partnerRows(){
  var mgr=isMgr(); var q=normStr(PARTF.q);
  var list=DB.partners.filter(function(p){
    if(p.type!==PARTF.tab) return false;
    if(q && normStr(p.name).indexOf(q)<0 && normStr(p.code).indexOf(q)<0 && String(p.phone||'').indexOf(PARTF.q.trim())<0) return false;
    return true;
  }).sort(function(a,b){return a.code.localeCompare(b.code,'vi');});
  var html=list.map(function(p){
    return '<tr>'+
      '<td><b>'+esc(p.code)+'</b></td><td>'+esc(p.name)+(p.note?'<div class="small muted">'+esc(p.note)+'</div>':'')+'</td>'+
      '<td>'+esc(p.phone||'')+'</td><td>'+esc(p.address||'')+'</td><td>'+esc(p.taxCode||'')+'</td>'+
      '<td class="c">'+(p.active===false?'<span class="tag tag-gray">Ngừng GD</span>':'<span class="tag tag-green">Hoạt động</span>')+'</td>'+
      (mgr?'<td class="c" style="white-space:nowrap"><button class="btn btn-xs btn-ghost" onclick="partnerForm(\''+p.type+'\',\''+p.id+'\')">Sửa</button> <button class="btn btn-xs btn-danger" onclick="deletePartner(\''+p.id+'\')">Xóa</button></td>':'')+
    '</tr>';
  }).join('');
  $('#pt-tbody').innerHTML=html||'<tr><td colspan="7"><div class="empty">Chưa có '+(PARTF.tab==='supplier'?'nhà cung cấp':'khách hàng')+' nào</div></td></tr>';
}
function partnerForm(type,id){
  if(!isMgr()) return;
  var p=id?partnerById(id):null;
  var label=type==='supplier'?'nhà cung cấp':'khách hàng';
  openModal({
    title:(p?'Sửa ':'Thêm ')+label, size:'md',
    body:
    '<div class="form-grid">'+
      '<div class="field"><label>Mã <span class="req">*</span></label><input id="paf-code" value="'+esc(p?p.code:suggestPartnerCode(type))+'"></div>'+
      '<div class="field"><label>Tên '+label+' <span class="req">*</span></label><input id="paf-name" value="'+esc(p?p.name:'')+'"></div>'+
      '<div class="field"><label>Điện thoại</label><input id="paf-phone" value="'+esc(p?p.phone:'')+'"></div>'+
      '<div class="field"><label>Mã số thuế</label><input id="paf-tax" value="'+esc(p?p.taxCode:'')+'"></div>'+
      (p?'<div class="field"><label>Trạng thái</label><select id="paf-active"><option value="1" '+(p.active!==false?'selected':'')+'>Hoạt động</option><option value="0" '+(p.active===false?'selected':'')+'>Ngừng giao dịch</option></select></div>':'')+
    '</div>'+
    '<div class="field"><label>Địa chỉ</label><input id="paf-addr" value="'+esc(p?p.address:'')+'"></div>'+
    '<div class="field"><label>Ghi chú</label><input id="paf-note" value="'+esc(p?p.note:'')+'"></div>',
    footer:'<button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="savePartner(\''+type+'\',\''+(p?p.id:'')+'\')">Lưu</button>'
  });
}
function suggestPartnerCode(type){
  var pre=type==='supplier'?'NCC':'KH';
  var n=DB.partners.filter(function(p){return p.type===type;}).length+1, code;
  do{ code=pre+String(n).padStart(3,'0'); n++; }while(DB.partners.some(function(p){return p.code===code;}));
  return code;
}
function savePartner(type,id){
  var code=($('#paf-code').value||'').trim().toUpperCase();
  var name=($('#paf-name').value||'').trim();
  if(!code) return toast('Nhập mã','error');
  if(!name) return toast('Nhập tên','error');
  if(DB.partners.some(function(p){return p.code.toUpperCase()===code && p.id!==id;})) return toast('Mã "'+code+'" đã tồn tại','error');
  var data={ code:code, name:name, phone:($('#paf-phone').value||'').trim(), taxCode:($('#paf-tax').value||'').trim(), address:($('#paf-addr').value||'').trim(), note:($('#paf-note').value||'').trim() };
  if(id){
    var p=partnerById(id);
    Object.assign(p,data);
    p.active=$('#paf-active')?$('#paf-active').value==='1':p.active;
    audit('Sửa đối tác', p.code+' — '+p.name);
  } else {
    data.id=uid(); data.type=type; data.active=true;
    DB.partners.push(data);
    audit('Thêm đối tác', (type==='supplier'?'NCC ':'KH ')+data.code+' — '+data.name);
  }
  saveDB(); closeModal(); toast('Đã lưu','success');
  if(CURRENT_PAGE==='partners') partnerRows();
}
function deletePartner(id){
  if(!isMgr()) return;
  var p=partnerById(id); if(!p) return;
  var used=DB.vouchers.some(function(v){return v.partnerId===id;});
  if(used){
    confirmDlg('Không thể xóa','<b>'+esc(p.name)+'</b> đã phát sinh phiếu giao dịch, không thể xóa.<br><br>Chuyển sang <b>Ngừng giao dịch</b>?','Ngừng giao dịch',function(){
      p.active=false; audit('Ngừng giao dịch đối tác', p.code+' — '+p.name); saveDB(); toast('Đã cập nhật','success'); partnerRows();
    });
    return;
  }
  confirmDlg('Xóa đối tác','Xóa <b>'+esc(p.name)+'</b> ('+esc(p.code)+')?','Xóa',function(){
    DB.partners=DB.partners.filter(function(x){return x.id!==id;});
    audit('Xóa đối tác', p.code+' — '+p.name); saveDB(); toast('Đã xóa','success'); partnerRows();
  }, true);
}

/* ---------- KHO HÀNG ---------- */
RENDERERS.warehouses=function(c){
  var rows=DB.warehouses.map(function(w){
    var skuCount=0, val=0;
    var m=DB.stocks[w.id]||{};
    for(var pid in m){ if(m[pid]>0){ skuCount++; var p=prodById(pid); val+=m[pid]*((p&&p.costPrice)||0); } }
    return '<tr>'+
      '<td><b>'+esc(w.code)+'</b></td><td>'+esc(w.name)+'</td><td>'+esc(w.address||'')+'</td>'+
      '<td class="r">'+skuCount+'</td><td class="r">'+fmtMoney(val)+'</td>'+
      '<td class="c">'+(w.active===false?'<span class="tag tag-gray">Ngừng</span>':'<span class="tag tag-green">Hoạt động</span>')+'</td>'+
      '<td class="c" style="white-space:nowrap"><button class="btn btn-xs btn-ghost" onclick="warehouseForm(\''+w.id+'\')">Sửa</button> <button class="btn btn-xs btn-danger" onclick="deleteWarehouse(\''+w.id+'\')">Xóa</button></td>'+
    '</tr>';
  }).join('');
  c.innerHTML=
  '<div class="toolbar"><div class="grow"></div><div class="toolbar-right"><button class="btn btn-primary btn-sm" onclick="warehouseForm()">＋ Thêm kho</button></div></div>'+
  '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Mã kho</th><th>Tên kho</th><th>Địa chỉ</th><th class="r">Số mặt hàng có tồn</th><th class="r">Giá trị tồn (đ)</th><th class="c">Trạng thái</th><th class="c">Thao tác</th></tr></thead>'+
  '<tbody>'+(rows||'<tr><td colspan="7"><div class="empty">Chưa có kho nào — hãy thêm ít nhất một kho để bắt đầu nhập hàng</div></td></tr>')+'</tbody></table></div>';
};
function warehouseForm(id){
  var w=id?whById(id):null;
  openModal({
    title:w?'Sửa kho — '+w.code:'Thêm kho mới', size:'sm',
    body:
      '<div class="field"><label>Mã kho <span class="req">*</span></label><input id="whf-code" value="'+esc(w?w.code:('KHO'+String(DB.warehouses.length+1).padStart(2,'0')))+'"></div>'+
      '<div class="field"><label>Tên kho <span class="req">*</span></label><input id="whf-name" value="'+esc(w?w.name:'')+'" placeholder="Kho chính, Kho chi nhánh…"></div>'+
      '<div class="field"><label>Địa chỉ</label><input id="whf-addr" value="'+esc(w?w.address:'')+'"></div>'+
      (w?'<div class="field"><label>Trạng thái</label><select id="whf-active"><option value="1" '+(w.active!==false?'selected':'')+'>Hoạt động</option><option value="0" '+(w.active===false?'selected':'')+'>Ngừng sử dụng</option></select></div>':''),
    footer:'<button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveWarehouse(\''+(w?w.id:'')+'\')">Lưu</button>'
  });
}
function saveWarehouse(id){
  var code=($('#whf-code').value||'').trim().toUpperCase();
  var name=($('#whf-name').value||'').trim();
  if(!code||!name) return toast('Nhập đủ mã và tên kho','error');
  if(DB.warehouses.some(function(w){return w.code.toUpperCase()===code && w.id!==id;})) return toast('Mã kho đã tồn tại','error');
  if(id){
    var w=whById(id);
    w.code=code; w.name=name; w.address=($('#whf-addr').value||'').trim();
    w.active=$('#whf-active')?$('#whf-active').value==='1':w.active;
    audit('Sửa kho', code+' — '+name);
  } else {
    DB.warehouses.push({id:uid(), code:code, name:name, address:($('#whf-addr').value||'').trim(), active:true});
    audit('Thêm kho', code+' — '+name);
  }
  saveDB(); closeModal(); toast('Đã lưu kho','success'); refreshPage();
}
function deleteWarehouse(id){
  var w=whById(id); if(!w) return;
  var hasStock=false, m=DB.stocks[id]||{};
  for(var pid in m){ if(Math.abs(m[pid])>1e-9){ hasStock=true; break; } }
  var used=DB.vouchers.some(function(v){return v.warehouseId===id||v.toWarehouseId===id;});
  if(hasStock) return toast('Kho còn hàng tồn — hãy chuyển hết hàng sang kho khác trước khi xóa','error');
  if(used){
    confirmDlg('Không thể xóa','Kho <b>'+esc(w.name)+'</b> đã phát sinh phiếu, không thể xóa.<br><br>Chuyển sang <b>Ngừng sử dụng</b>?','Ngừng sử dụng',function(){
      w.active=false; audit('Ngừng sử dụng kho', w.code); saveDB(); toast('Đã cập nhật','success'); refreshPage();
    });
    return;
  }
  confirmDlg('Xóa kho','Xóa kho <b>'+esc(w.name)+'</b>?','Xóa',function(){
    DB.warehouses=DB.warehouses.filter(function(x){return x.id!==id;});
    delete DB.stocks[id];
    audit('Xóa kho', w.code+' — '+w.name); saveDB(); toast('Đã xóa kho','success'); refreshPage();
  }, true);
}

/* ---------- NGƯỜI DÙNG ---------- */
RENDERERS.users=function(c){
  var rows=DB.users.map(function(u){
    return '<tr>'+
      '<td><b>'+esc(u.username)+'</b>'+(SESSION.id===u.id?' <span class="tag">bạn</span>':'')+'</td>'+
      '<td>'+esc(u.fullName||'')+'</td>'+
      '<td><span class="badge" style="background:'+(u.role==='admin'?'#eff6ff;color:#1d4ed8':u.role==='manager'?'#f0fdf4;color:#15803d':'#f8fafc;color:#475569')+'">'+ROLES[u.role]+'</span></td>'+
      '<td class="muted small">'+fmtDateTime(u.createdAt)+'</td>'+
      '<td class="c">'+(u.active===false?'<span class="tag tag-red">Đã khóa</span>':'<span class="tag tag-green">Hoạt động</span>')+'</td>'+
      '<td class="c" style="white-space:nowrap">'+
        '<button class="btn btn-xs btn-ghost" onclick="userForm(\''+u.id+'\')">Sửa</button> '+
        '<button class="btn btn-xs btn-ghost" onclick="resetPassModal(\''+u.id+'\')">Đặt lại MK</button>'+
      '</td>'+
    '</tr>';
  }).join('');
  c.innerHTML=
  '<div class="card" style="padding:12px 16px;font-size:13px" >👥 <b>Phân quyền:</b> <b>Quản trị</b> — toàn quyền (người dùng, sao lưu, cài đặt, xóa phiếu vĩnh viễn); <b>Quản lý</b> — nghiệp vụ, kiểm kê, báo cáo, sửa/hủy phiếu; <b>Nhân viên</b> — lập phiếu nhập/xuất/chuyển/trả, xem tồn kho và lịch sử.</div>'+
  '<div class="toolbar"><div class="grow"></div><div class="toolbar-right"><button class="btn btn-primary btn-sm" onclick="userForm()">＋ Thêm người dùng</button></div></div>'+
  '<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Tên đăng nhập</th><th>Họ tên</th><th>Vai trò</th><th>Ngày tạo</th><th class="c">Trạng thái</th><th class="c">Thao tác</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
};
function userForm(id){
  var u=id?DB.users.find(function(x){return x.id===id;}):null;
  openModal({
    title:u?'Sửa người dùng — '+u.username:'Thêm người dùng', size:'sm',
    body:
      '<div class="field"><label>Tên đăng nhập <span class="req">*</span></label><input id="uf-un" value="'+esc(u?u.username:'')+'" '+(u?'disabled':'')+' placeholder="viết liền, không dấu"></div>'+
      '<div class="field"><label>Họ tên</label><input id="uf-fn" value="'+esc(u?u.fullName:'')+'"></div>'+
      '<div class="field"><label>Vai trò</label><select id="uf-role">'+
        Object.keys(ROLES).map(function(r){return '<option value="'+r+'" '+(u&&u.role===r?'selected':'')+'>'+ROLES[r]+'</option>';}).join('')+
      '</select></div>'+
      (!u?'<div class="field"><label>Mật khẩu <span class="req">*</span></label><input type="password" id="uf-pw" placeholder="Tối thiểu 4 ký tự"></div>':'')+
      (u?'<div class="field"><label>Trạng thái</label><select id="uf-active"><option value="1" '+(u.active!==false?'selected':'')+'>Hoạt động</option><option value="0" '+(u.active===false?'selected':'')+'>Khóa tài khoản</option></select></div>':''),
    footer:'<button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="saveUser(\''+(u?u.id:'')+'\')">Lưu</button>'
  });
}
function countActiveAdmins(){ return DB.users.filter(function(u){return u.role==='admin'&&u.active!==false;}).length; }
function saveUser(id){
  if(id){
    var u=DB.users.find(function(x){return x.id===id;});
    var role=$('#uf-role').value, active=$('#uf-active').value==='1';
    if(u.role==='admin' && (role!=='admin'||!active) && countActiveAdmins()<=1) return toast('Đây là quản trị viên hoạt động cuối cùng — không thể hạ quyền hay khóa','error');
    if(u.id===SESSION.id && !active) return toast('Không thể tự khóa tài khoản của chính mình','error');
    u.fullName=($('#uf-fn').value||'').trim(); u.role=role; u.active=active;
    audit('Sửa người dùng', u.username+' — '+ROLES[u.role]+(active?'':' (khóa)'));
    if(u.id===SESSION.id){ $('#user-role').textContent=ROLES[u.role]; buildNav(); }
  } else {
    var un=($('#uf-un').value||'').trim().toLowerCase().replace(/\s/g,'');
    var pw=$('#uf-pw').value||'';
    if(!un) return toast('Nhập tên đăng nhập','error');
    if(!/^[a-z0-9._-]{3,}$/.test(un)) return toast('Tên đăng nhập: tối thiểu 3 ký tự, chỉ chữ thường/số/._-','error');
    if(DB.users.some(function(x){return x.username===un;})) return toast('Tên đăng nhập đã tồn tại','error');
    if(pw.length<4) return toast('Mật khẩu tối thiểu 4 ký tự','error');
    DB.users.push({id:uid(), username:un, passHash:hashPass(pw), fullName:($('#uf-fn').value||'').trim(), role:$('#uf-role').value, active:true, createdAt:nowISO()});
    audit('Thêm người dùng', un+' — '+ROLES[$('#uf-role').value]);
  }
  saveDB(); closeModal(); toast('Đã lưu người dùng','success'); refreshPage();
}
function resetPassModal(id){
  var u=DB.users.find(function(x){return x.id===id;}); if(!u) return;
  openModal({
    title:'Đặt lại mật khẩu — '+u.username, size:'sm',
    body:'<div class="field"><label>Mật khẩu mới (tối thiểu 4 ký tự)</label><input type="password" id="rp-pw"></div>',
    footer:'<button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="doResetPass(\''+id+'\')">Đặt lại</button>'
  });
}
function doResetPass(id){
  var u=DB.users.find(function(x){return x.id===id;}); if(!u) return;
  var pw=$('#rp-pw').value||'';
  if(pw.length<4) return toast('Mật khẩu tối thiểu 4 ký tự','error');
  u.passHash=hashPass(pw);
  audit('Đặt lại mật khẩu','Cho tài khoản '+u.username);
  saveDB(); closeModal(); toast('Đã đặt lại mật khẩu cho '+u.username,'success');
}
</script>

<script>
'use strict';
/* ==================== PHIẾU: NHẬP / XUẤT / CHUYỂN / TRẢ / KIỂM KÊ ==================== */

var VF=null; // trạng thái form phiếu đang soạn

function typePage(t){ return t==='in'?'stockin':t==='out'?'stockout':t==='transfer'?'transfer':(t==='return_sup'||t==='return_cus')?'returns':'history'; }
function vfNeedsStock(t){ return t==='out'||t==='transfer'||t==='return_sup'; }
function vfHasPrice(t){ return t!=='transfer'; }
function vfPartnerType(t){ return (t==='in'||t==='return_sup')?'supplier':(t==='out'||t==='return_cus')?'customer':null; }
function vfPayLabels(t){
  return t==='in'         ? {label:'Đã trả NCC (đ)',          owe:'Còn nợ NCC'}
       : t==='out'        ? {label:'Khách đã trả (đ)',        owe:'Khách còn nợ'}
       : t==='return_sup' ? {label:'NCC đã hoàn tiền (đ)',    owe:'NCC còn phải hoàn'}
       : t==='return_cus' ? {label:'Đã hoàn tiền khách (đ)',  owe:'Còn phải hoàn khách'}
       : null;
}
function voucherRemain(v){ return round2((v.total||0)-((v.paid===undefined)?(v.total||0):v.paid)); }

/* ---------- Danh sách phiếu theo loại ---------- */
function partnerColLabel(types){
  if(types.length===1){
    var pt=vfPartnerType(types[0]);
    if(pt==='supplier') return 'Nhà cung cấp';
    if(pt==='customer') return 'Khách hàng';
  }
  return 'Đối tác';
}
function voucherTable(types, limit){
  var list=DB.vouchers.filter(function(v){ return types.indexOf(v.type)>=0; }).slice(0,limit||30);
  var rows=list.map(function(v){
    var vt=VTYPES[v.type];
    var isVoid=v.status==='void';
    var remain=(!isVoid && isMoneyVoucher(v.type)) ? voucherRemain(v) : 0;
    return '<tr class="click" onclick="voucherDetail(\''+v.id+'\')">'+
      '<td><span class="badge" style="background:'+vt.color+'1a;color:'+vt.color+'">'+vt.icon+' '+esc(v.code)+'</span></td>'+
      '<td>'+fmtDate(v.date)+'</td>'+
      '<td>'+esc(whName(v.warehouseId))+(v.type==='transfer'?' → '+esc(whName(v.toWarehouseId)):'')+'</td>'+
      '<td>'+(v.partnerId?esc(partnerName(v.partnerId)):'<span class="muted">—</span>')+'</td>'+
      '<td class="r">'+v.lines.length+'</td>'+
      '<td class="r"'+(isVoid?' style="text-decoration:line-through"':'')+'><b>'+fmtMoney(v.total)+'</b></td>'+
      '<td class="r">'+(isMoneyVoucher(v.type)&&!isVoid ? (Math.abs(remain)<0.005?'<span class="tag tag-green">Đã TT đủ</span>':'<b class="num-neg">'+fmtMoney(remain)+'</b>') : '<span class="muted">—</span>')+'</td>'+
      '<td class="muted">'+esc(v.createdBy)+'</td>'+
      '<td class="c">'+(isVoid?'<span class="tag tag-red">Đã hủy</span>':'<span class="tag tag-green">Đã ghi sổ</span>')+'</td>'+
    '</tr>';
  }).join('');
  return '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
    '<th>Số phiếu</th><th>Ngày</th><th>Kho</th><th>'+partnerColLabel(types)+'</th><th class="r">Dòng</th><th class="r">Tổng tiền (đ)</th><th class="r">Còn nợ (đ)</th><th>Người lập</th><th class="c">Trạng thái</th>'+
    '</tr></thead><tbody>'+(rows||'<tr><td colspan="9"><div class="empty">Chưa có phiếu nào</div></td></tr>')+'</tbody></table></div>'+
    '<div class="pagin">Hiển thị '+Math.min(list.length,limit||30)+' phiếu gần nhất — xem tất cả trong mục <a href="javascript:showPage(\'history\')">Lịch sử phiếu</a></div>';
}
function bizPage(c, type, introHTML){
  var vt=VTYPES[type];
  c.innerHTML=
    '<div class="toolbar">'+
      '<div class="grow" style="font-size:13px;color:var(--muted)">'+(introHTML||'')+'</div>'+
      '<div class="toolbar-right"><button class="btn btn-primary" onclick="openVoucherForm(\''+type+'\')">＋ Tạo '+vt.name.toLowerCase()+'</button></div>'+
    '</div>'+voucherTable([type]);
}
RENDERERS.stockin=function(c){ bizPage(c,'in','Ghi nhận hàng hóa nhập vào kho từ nhà cung cấp. Giá vốn được cập nhật tự động theo bình quân gia quyền.'); };
RENDERERS.stockout=function(c){ bizPage(c,'out','Ghi nhận hàng xuất bán / xuất sử dụng. Hệ thống tự kiểm tra tồn kho và chốt giá vốn để tính lợi nhuận.'); };
