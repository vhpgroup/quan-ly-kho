/* ---------- FORM LẬP PHIẾU ---------- */
function openVoucherForm(type, editId){
  var vt=VTYPES[type]; if(!vt) return;
  var editV=editId ? DB.vouchers.find(function(x){return x.id===editId;}) : null;
  if(editId && !editV) return toast('Không tìm thấy phiếu cần sửa','error');
  if(editV){
    if(!isMgr()) return toast('Chỉ Quản lý / Quản trị mới được sửa phiếu','warn');
    if(editV.status==='void') return toast('Phiếu đã hủy — không thể sửa','warn');
    if(editV.type==='adjust') return toast('Phiếu điều chỉnh kiểm kê không sửa được — hãy hủy/xóa phiếu rồi kiểm kê lại','warn');
    type=editV.type; vt=VTYPES[type];
  }
  if(!activeWarehouses().length){ toast('Chưa có kho nào — hãy tạo kho trong mục "Kho hàng" trước','warn'); if(can('warehouses')) showPage('warehouses'); return; }
  if(type==='transfer' && !editV && activeWarehouses().length<2){ toast('Cần ít nhất 2 kho để chuyển kho','warn'); return; }
  if(!activeProducts().length && !editV){ toast('Chưa có sản phẩm nào — hãy thêm sản phẩm trước','warn'); showPage('products'); return; }

  var preLines=[];
  if(editV){
    var dropped=0;
    editV.lines.forEach(function(l){
      if(prodById(l.productId)) preLines.push({productId:l.productId, qty:l.qty, price:l.price});
      else dropped++;
    });
    if(dropped) toast(dropped+' dòng hàng bị bỏ qua do sản phẩm đã bị xóa khỏi danh mục','warn');
  }
  VF={type:type, lines:preLines, editId:editV?editV.id:null};

  var whs=activeWarehouses().slice();
  if(editV && !whs.some(function(w){return w.id===editV.warehouseId;}) && whById(editV.warehouseId)) whs.unshift(whById(editV.warehouseId));
  if(editV && editV.toWarehouseId && !whs.some(function(w){return w.id===editV.toWarehouseId;}) && whById(editV.toWarehouseId)) whs.push(whById(editV.toWarehouseId));
  var pt=vfPartnerType(type);
  var partners=pt?activePartners(pt).slice():[];
  if(editV && editV.partnerId && pt && !partners.some(function(p){return p.id===editV.partnerId;}) && partnerById(editV.partnerId)) partners.unshift(partnerById(editV.partnerId));
  var selWh=editV?editV.warehouseId:whs[0].id;
  var selToWh=editV?editV.toWarehouseId:(whs[1]?whs[1].id:null);
  var whLabel=type==='in'||type==='return_cus'?'Kho nhập':type==='transfer'?'Kho xuất (nguồn)':'Kho xuất';
  var c=$('#content');
  $('#page-title').textContent=(editV?'Sửa ':'Tạo ')+vt.name.toLowerCase();
  $$('#nav .nav-item').forEach(function(el){ el.classList.toggle('active', el.id==='nav-'+typePage(type)); });
  CURRENT_PAGE=typePage(type);
  c.scrollTop=0;
  c.innerHTML=
  '<div class="card">'+
    '<div class="card-title"><span>'+(editV?'✏️ Sửa phiếu <b>'+esc(editV.code)+'</b>':vt.icon+' '+vt.name)+' <span class="muted small" style="font-weight:400">'+(editV?'— số phiếu giữ nguyên, tồn kho sẽ được tính lại theo nội dung mới':'— số phiếu cấp tự động khi lưu')+'</span></span>'+
    '<button class="btn btn-sm btn-ghost" onclick="showPage(\''+typePage(type)+'\')">← Quay lại</button></div>'+
    (editV&&type==='in'?'<div class="banner banner-warn" style="margin-bottom:12px">💡 Sửa phiếu nhập sẽ tính lại giá vốn bình quân tại thời điểm lưu (không hồi tố các phiếu xuất đã lập trước đó).</div>':'')+
    '<div class="form-grid">'+
      '<div class="field"><label>Ngày chứng từ <span class="req">*</span></label><input type="date" id="vf-date" value="'+(editV?editV.date:todayStr())+'"></div>'+
      '<div class="field"><label>'+whLabel+' <span class="req">*</span></label><select id="vf-wh" onchange="renderVFLines()">'+whs.map(function(w){return '<option value="'+w.id+'" '+(w.id===selWh?'selected':'')+'>'+esc(w.name)+'</option>';}).join('')+'</select></div>'+
      (type==='transfer'?'<div class="field"><label>Kho nhận (đích) <span class="req">*</span></label><select id="vf-towh">'+whs.map(function(w){return '<option value="'+w.id+'" '+(w.id===selToWh?'selected':'')+'>'+esc(w.name)+'</option>';}).join('')+'</select></div>':'')+
      (pt?'<div class="field"><label>'+(pt==='supplier'?'Nhà cung cấp':'Khách hàng')+'</label><select id="vf-partner"><option value="">— Không chọn —</option>'+partners.map(function(p){return '<option value="'+p.id+'" '+(editV&&editV.partnerId===p.id?'selected':'')+'>'+esc(p.name)+'</option>';}).join('')+'</select></div>':'')+
      (isMoneyVoucher(type)?'<div class="field"><label>'+vfPayLabels(type).label+'</label>'+
        '<div style="display:flex;gap:6px"><input type="number" min="0" step="any" id="vf-paid" style="text-align:right" value="'+(editV?((editV.paid===undefined)?editV.total:editV.paid):0)+'" oninput="vfUpdateCalc()"><button class="btn btn-ghost" type="button" onclick="vfPayFull()" title="Điền bằng đúng tổng tiền phiếu">Đủ</button></div>'+
        '<div class="small" id="vf-debt" style="margin-top:5px"></div></div>':'')+
      '<div class="field"><label>Ghi chú</label><input id="vf-note" placeholder="Diễn giải…" value="'+esc(editV?editV.note:'')+'"></div>'+
    '</div>'+
  '</div>'+
  '<div class="card">'+
    '<div class="card-title">Danh sách hàng hóa</div>'+
    '<div class="prod-search" style="margin-bottom:12px;max-width:520px">'+
      '<input id="vf-search" placeholder="🔍 Gõ tên hoặc mã sản phẩm để thêm vào phiếu…" autocomplete="off">'+
      '<div id="vf-search-dd" class="dropdown hidden"></div>'+
    '</div>'+
    '<div id="vf-lines"></div>'+
  '</div>'+
  '<div style="display:flex;gap:10px;justify-content:flex-end">'+
    '<button class="btn btn-ghost" onclick="showPage(\''+typePage(type)+'\')">Hủy bỏ</button>'+
    '<button class="btn btn-ghost" onclick="saveVoucher(true)">💾 Lưu &amp; In phiếu</button>'+
    '<button class="btn btn-primary" onclick="saveVoucher(false)">'+(editV?'💾 Lưu thay đổi':'💾 Lưu phiếu')+'</button>'+
  '</div>';
  vfBindSearch();
  renderVFLines();
  $('#vf-search').focus();
}
function vfBindSearch(){
  var inp=$('#vf-search'), dd=$('#vf-search-dd');
  inp.addEventListener('input', function(){
    var q=normStr(inp.value);
    if(!q){ dd.classList.add('hidden'); return; }
    var whId=$('#vf-wh').value;
    var list=activeProducts().filter(function(p){
      return normStr(p.name).indexOf(q)>=0 || normStr(p.sku).indexOf(q)>=0 || normStr(p.brand).indexOf(q)>=0;
    }).slice(0,8);
    dd.innerHTML=list.length?list.map(function(p){
      var st=vfNeedsStock(VF.type)?getStock(whId,p.id):totalStock(p.id);
      return '<div class="dd-item" onmousedown="vfPick(\''+p.id+'\')"><div><b>'+esc(p.name)+'</b> <span class="muted small">· '+esc(p.sku)+(p.brand?' · '+esc(p.brand):'')+'</span></div><div class="muted small">Tồn: '+fmtQty(st)+' '+esc(p.unit)+'</div></div>';
    }).join(''):'<div class="dd-empty">Không tìm thấy sản phẩm phù hợp</div>';
    dd.classList.remove('hidden');
  });
  inp.addEventListener('keydown', function(e){
    if(e.key==='Enter'){ e.preventDefault(); var first=dd.querySelector('.dd-item'); if(first) first.click(); }
    if(e.key==='Escape') dd.classList.add('hidden');
  });
  inp.addEventListener('blur', function(){ setTimeout(function(){ dd.classList.add('hidden'); },200); });
}
function vfDefaultPrice(p){
  var t=VF.type;
  if(t==='in'||t==='return_sup') return p.costPrice||0;
  if(t==='out'||t==='return_cus') return p.salePrice||0;
  return 0;
}
function vfPick(pid){
  var p=prodById(pid); if(!p) return;
  var ex=VF.lines.find(function(l){return l.productId===pid;});
  if(ex) ex.qty=round3(ex.qty+1);
  else VF.lines.push({productId:pid, qty:1, price:vfDefaultPrice(p)});
  $('#vf-search').value='';
  $('#vf-search-dd').classList.add('hidden');
  renderVFLines();
  $('#vf-search').focus();
}
function vfSetQty(i,val){ if(VF.lines[i]){ VF.lines[i].qty=parseNum(val); vfUpdateCalc(); } }
function vfSetPrice(i,val){ if(VF.lines[i]){ VF.lines[i].price=parseNum(val); vfUpdateCalc(); } }
function vfRemove(i){ VF.lines.splice(i,1); renderVFLines(); }
function vfUpdateCalc(){
  var whId=$('#vf-wh').value, hasPrice=vfHasPrice(VF.type), total=0;
  VF.lines.forEach(function(l,i){
    var amt=l.qty*(hasPrice?l.price:0); total+=amt;
    var amtEl=$('#vfl-amt-'+i); if(amtEl) amtEl.textContent=fmtMoney(amt);
    if(vfNeedsStock(VF.type)){
      var st=getStock(whId,l.productId);
      var qEl=$('#vfl-qty-'+i);
      if(qEl) qEl.style.borderColor = l.qty>st ? 'var(--red)' : '';
      var stEl=$('#vfl-st-'+i);
      if(stEl) stEl.className='r '+(l.qty>st?'num-neg':'muted');
    }
  });
  var tEl=$('#vf-total'); if(tEl) tEl.textContent=fmtMoney(total);
  vfUpdateDebt(total);
}
function vfUpdateDebt(total){
  var payEl=$('#vf-paid'), dEl=$('#vf-debt');
  if(!payEl||!dEl) return;
  var remain=round2(total-parseNum(payEl.value));
  var owe=vfPayLabels(VF.type).owe;
  if(Math.abs(remain)<0.005) dEl.innerHTML='<span class="num-pos">✓ Đã thanh toán đủ</span>';
  else if(remain>0) dEl.innerHTML=owe+': <b class="num-neg">'+fmtMoney(remain)+' đ</b>'+($('#vf-partner')&&!$('#vf-partner').value?' <span class="muted">— chọn đối tác để theo dõi công nợ</span>':'');
  else dEl.innerHTML='Trả thừa: <b style="color:var(--amber)">'+fmtMoney(-remain)+' đ</b>';
}
function vfPayFull(){
  var hasPrice=vfHasPrice(VF.type), total=0;
  VF.lines.forEach(function(l){ total+=l.qty*(hasPrice?l.price:0); });
  var payEl=$('#vf-paid'); if(payEl) payEl.value=round2(total);
  vfUpdateCalc();
}
function renderVFLines(){
  var box=$('#vf-lines'); if(!box||!VF) return;
  var t=VF.type, whId=$('#vf-wh').value;
  var needSt=vfNeedsStock(t), hasPrice=vfHasPrice(t);
  if(!VF.lines.length){
    box.innerHTML='<div class="empty">Chưa có dòng hàng nào — tìm sản phẩm ở ô phía trên để thêm vào phiếu</div>';
    vfUpdateDebt(0);
    return;
  }
  var total=0;
  var rows=VF.lines.map(function(l,i){
    var p=prodById(l.productId);
    var st=getStock(whId,l.productId);
    var amt=l.qty*(hasPrice?l.price:0); total+=amt;
    var over=needSt && l.qty>st;
    return '<tr>'+
      '<td class="c muted">'+(i+1)+'</td>'+
      '<td><b>'+esc(p.name)+'</b><div class="small muted">'+esc(p.sku)+'</div></td>'+
      '<td class="c">'+esc(p.unit)+'</td>'+
      (needSt?'<td id="vfl-st-'+i+'" class="r '+(over?'num-neg':'muted')+'">'+fmtQty(st)+'</td>':'')+
      '<td style="width:110px"><input type="number" step="any" min="0" id="vfl-qty-'+i+'" value="'+l.qty+'" style="text-align:right'+(over?';border-color:var(--red)':'')+'" oninput="vfSetQty('+i+',this.value)"></td>'+
      (hasPrice?'<td style="width:140px"><input type="number" step="any" min="0" value="'+l.price+'" style="text-align:right" oninput="vfSetPrice('+i+',this.value)"></td>':'')+
      (hasPrice?'<td class="r" id="vfl-amt-'+i+'"><b>'+fmtMoney(amt)+'</b></td>':'')+
      '<td class="c"><button class="btn btn-xs btn-danger" onclick="vfRemove('+i+')">✕</button></td>'+
    '</tr>';
  }).join('');
  box.innerHTML='<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
    '<th class="c" style="width:36px">#</th><th>Sản phẩm</th><th class="c">ĐVT</th>'+
    (needSt?'<th class="r">Tồn tại kho</th>':'')+
    '<th class="r">Số lượng</th>'+
    (hasPrice?'<th class="r">Đơn giá (đ)</th><th class="r">Thành tiền (đ)</th>':'')+
    '<th class="c" style="width:50px"></th>'+
    '</tr></thead><tbody>'+rows+'</tbody>'+
    (hasPrice?'<tfoot><tr><td colspan="'+(needSt?6:5)+'" class="r">TỔNG CỘNG</td><td class="r" id="vf-total" style="font-size:15px;color:var(--primary)">'+fmtMoney(total)+'</td><td></td></tr></tfoot>':'')+
    '</table></div>';
  vfUpdateDebt(total);
}
function saveVoucher(doPrint){
  if(!VF) return;
  var inp={
    type:VF.type,
    date:$('#vf-date').value,
    warehouseId:$('#vf-wh').value,
    toWarehouseId:$('#vf-towh')?$('#vf-towh').value:null,
    partnerId:$('#vf-partner')?($('#vf-partner').value||null):null,
    note:($('#vf-note').value||'').trim(),
    paid:$('#vf-paid')?parseNum($('#vf-paid').value):0,
    lines:VF.lines
  };
  if(!inp.date) return toast('Chọn ngày chứng từ','error');
  var res=VF.editId ? updateVoucher(VF.editId, inp) : postVoucher(inp);
  if(!res.ok) return toast(res.error,'error');
  toast((VF.editId?'Đã cập nhật ':'Đã lưu ')+VTYPES[inp.type].name.toLowerCase()+' số '+res.voucher.code,'success');
  var pg=typePage(inp.type);
  VF=null;
  showPage(pg);
  if(doPrint) printVoucher(res.voucher.id);
}

/* ---------- CHI TIẾT PHIẾU ---------- */
function voucherDetail(id){
  var v=DB.vouchers.find(function(x){return x.id===id;}); if(!v) return;
  var vt=VTYPES[v.type];
  var hasPrice=vfHasPrice(v.type) && v.type!=='adjust';
  var isAdj=v.type==='adjust';
  var rows=v.lines.map(function(l,i){
    return '<tr>'+
      '<td class="c muted">'+(i+1)+'</td>'+
      '<td>'+esc(l.name)+'<div class="small muted">'+esc(l.sku)+'</div></td>'+
      '<td class="c">'+esc(l.unit)+'</td>'+
      '<td class="r '+(isAdj?(l.qty>=0?'num-pos':'num-neg'):'')+'">'+(isAdj&&l.qty>0?'+':'')+fmtQty(l.qty)+'</td>'+
      (hasPrice?'<td class="r">'+fmtMoney(l.price)+'</td><td class="r"><b>'+fmtMoney(l.qty*l.price)+'</b></td>':'')+
      (v.type==='out'?'<td class="r muted">'+fmtMoney(l.cost)+'</td><td class="r '+((l.price-l.cost)>=0?'num-pos':'num-neg')+'">'+fmtMoney((l.price-l.cost)*l.qty)+'</td>':'')+
    '</tr>';
  }).join('');
  var info=
    '<div class="form-grid" style="margin-bottom:14px">'+
      '<div><div class="small muted">Ngày chứng từ</div><b>'+fmtDate(v.date)+'</b></div>'+
      '<div><div class="small muted">'+(v.type==='transfer'?'Kho xuất → Kho nhận':'Kho')+'</div><b>'+esc(whName(v.warehouseId))+(v.type==='transfer'?' → '+esc(whName(v.toWarehouseId)):'')+'</b></div>'+
      (v.partnerId?'<div><div class="small muted">'+(vfPartnerType(v.type)==='supplier'?'Nhà cung cấp':'Khách hàng')+'</div><b>'+esc(partnerName(v.partnerId))+'</b></div>':'')+
      '<div><div class="small muted">Người lập</div><b>'+esc(v.createdBy)+'</b> <span class="small muted">'+fmtDateTime(v.createdAt)+'</span></div>'+
      (v.editedAt?'<div><div class="small muted">Sửa lần cuối</div><b>'+esc(v.editedBy||'')+'</b> <span class="small muted">'+fmtDateTime(v.editedAt)+'</span></div>':'')+
    '</div>'+
    (v.note?'<div style="margin-bottom:12px" class="small">📝 '+esc(v.note)+'</div>':'')+
    (v.status==='void'?'<div class="banner banner-warn" style="margin-bottom:12px">⛔ Phiếu này đã bị hủy bởi <b>'+esc(v.voidedBy||'')+'</b> lúc '+fmtDateTime(v.voidedAt)+' — không còn tác động lên tồn kho.</div>':'');
  var profit=0;
  if(v.type==='out'){ v.lines.forEach(function(l){ profit+=(l.price-l.cost)*l.qty; }); }
  var payHTML='';
  if(isMoneyVoucher(v.type) && v.status!=='void'){
    var paid=(v.paid===undefined)?v.total:v.paid;
    var remain=voucherRemain(v);
    payHTML='<div style="margin-top:12px;display:flex;gap:20px;justify-content:flex-end;flex-wrap:wrap;font-size:13.5px;align-items:center">'+
      '<span>'+vfPayLabels(v.type).label.replace(' (đ)','')+': <b class="num-pos">'+fmtMoney(paid)+' đ</b></span>'+
      '<span>'+(Math.abs(remain)<0.005 ? '<span class="tag tag-green">✓ Đã thanh toán đủ</span>'
        : remain>0 ? vfPayLabels(v.type).owe+': <b class="num-neg">'+fmtMoney(remain)+' đ</b>'
        : 'Trả thừa: <b style="color:var(--amber)">'+fmtMoney(-remain)+' đ</b>')+'</span>'+
      (remain>0.005 && v.partnerId ? '<button class="btn btn-sm btn-success" onclick="closeModal();paymentForm(\''+((v.type==='out'||v.type==='return_sup')?'receipt':'payment')+'\',\''+v.partnerId+'\','+remain+')">💳 Ghi nhận thanh toán</button>' : '')+
      '</div>';
  }
  openModal({
    title:vt.icon+' '+vt.name+' — '+v.code, size:'lg',
    body: info+
      '<div class="tbl-wrap"><table class="tbl"><thead><tr>'+
      '<th class="c">#</th><th>Sản phẩm</th><th class="c">ĐVT</th><th class="r">'+(isAdj?'Chênh lệch':'Số lượng')+'</th>'+
      (hasPrice?'<th class="r">Đơn giá</th><th class="r">Thành tiền</th>':'')+
      (v.type==='out'?'<th class="r">Giá vốn</th><th class="r">Lợi nhuận</th>':'')+
      '</tr></thead><tbody>'+rows+'</tbody>'+
      (hasPrice?'<tfoot><tr><td colspan="4" class="r">TỔNG CỘNG</td><td></td><td class="r" style="color:var(--primary)">'+fmtMoney(v.total)+'</td>'+(v.type==='out'?'<td></td><td class="r '+(profit>=0?'num-pos':'num-neg')+'">'+fmtMoney(profit)+'</td>':'')+'</tr></tfoot>':'')+
      '</table></div>'+payHTML,
    footer:
      '<button class="btn btn-ghost" onclick="closeModal()">Đóng</button>'+
      (isAdmin()?'<button class="btn btn-danger" onclick="askDeleteVoucher(\''+v.id+'\')">🗑️ Xóa phiếu</button>':'')+
      (v.status!=='void' && isMgr()?'<button class="btn btn-danger" onclick="askVoidVoucher(\''+v.id+'\')">⛔ Hủy phiếu</button>':'')+
      (v.status!=='void' && isMgr() && v.type!=='adjust'?'<button class="btn btn-ghost" onclick="closeModal();openVoucherForm(\''+v.type+'\',\''+v.id+'\')">✏️ Sửa phiếu</button>':'')+
      (v.status!=='void'?'<button class="btn btn-primary" onclick="printVoucher(\''+v.id+'\')">🖨️ In phiếu</button>':'')
  });
}
function askVoidVoucher(id){
  var v=DB.vouchers.find(function(x){return x.id===id;}); if(!v) return;
  confirmDlg('Hủy phiếu '+v.code,'Hủy phiếu sẽ <b>hoàn tác toàn bộ tác động tồn kho</b> của phiếu này (giá vốn bình quân hiện tại giữ nguyên). Phiếu vẫn được giữ trong lịch sử với trạng thái "Đã hủy" để tra cứu.<br><br>Bạn chắc chắn muốn hủy?','Hủy phiếu',function(){
    var res=voidVoucher(id);
    if(!res.ok) return toast(res.error,'error');
    toast('Đã hủy phiếu '+v.code,'success');
    refreshPage();
  }, true);
}
function askDeleteVoucher(id){
  if(!isAdmin()) return toast('Chỉ Quản trị viên mới được xóa phiếu','warn');
  var v=DB.vouchers.find(function(x){return x.id===id;}); if(!v) return;

    ? 'Phiếu <b>'+esc(v.code)+'</b> đã hủy trước đó (tồn kho đã hoàn tác). Xóa sẽ <b>gỡ vĩnh viễn phiếu khỏi lịch sử</b> — không thể khôi phục.<br><br>Bạn chắc chắn muốn xóa?'
    : 'Xóa phiếu <b>'+esc(v.code)+'</b> sẽ <b>hoàn tác toàn bộ tác động tồn kho</b> rồi <b>gỡ vĩnh viễn phiếu khỏi lịch sử</b> — không thể khôi phục và số phiếu này sẽ bị khuyết.<br><br>💡 Nếu chỉ cần vô hiệu phiếu, nên dùng <b>Hủy phiếu</b> để giữ dấu vết sổ sách. Chỉ xóa với phiếu tạo nhầm / phiếu rác.<br><br>Bạn chắc chắn muốn xóa vĩnh viễn?';
  confirmDlg('🗑️ Xóa phiếu '+v.code, msg, 'Xóa vĩnh viễn', function(){

    if(!res.ok) return toast(res.error,'error');
    toast('Đã xóa phiếu '+v.code+(v.status!=='void'?' và hoàn tác tồn kho':''),'success');
    refreshPage();
  }, true);
}

    : v.type==='adjust'
    ? ['Người lập phiếu','Thủ kho','Kế toán','Giám đốc']
    : ['Người lập phiếu', (VTYPES[v.type].flow==='+'?'Người giao hàng':'Người nhận hàng'),'Thủ kho','Kế toán'];

      '<div class="co"><b>'+esc(s.companyName||'CÔNG TY')+'</b><br>'+esc(s.companyAddress||'')+(s.companyPhone?'<br>ĐT: '+esc(s.companyPhone):'')+(s.companyTax?'<br>MST: '+esc(s.companyTax):'')+'</div>'+
      '<div style="text-align:right">Số: <b>'+esc(v.code)+'</b><br><i>Ngày '+d[2]+' tháng '+d[1]+' năm '+d[0]+'</i></div>'+
    '</div>'+
    '<h1>'+titles[v.type]+'</h1>'+
    '<div class="pv-code">Người lập: '+esc(v.createdBy)+(v.status==='void'?' — <b>PHIẾU ĐÃ HỦY</b>':'')+'</div>'+
    '<div class="pv-info">'+info+'</div>'+

    (hasPrice?'<th style="width:100px">Đơn giá (đ)</th><th style="width:120px">Thành tiền (đ)</th>':'')+
    '</tr></thead><tbody>'+rows+
    (hasPrice?'<tr><td colspan="6" class="r"><b>TỔNG CỘNG</b></td><td class="r"><b>'+fmtMoney(v.total)+'</b></td></tr>':'')+
    '</tbody></table>'+
    (hasPrice?'<div class="pv-words">Bằng chữ: <b>'+docSoTien(v.total)+'</b>'+
      (isMoneyVoucher(v.type)&&voucherRemain(v)>0.005?'<br>Đã thanh toán: <b>'+fmtMoney((v.paid===undefined)?v.total:v.paid)+' đ</b> — Còn nợ: <b>'+fmtMoney(voucherRemain(v))+' đ</b>':'')+
      '</div>':'<div style="height:12px"></div>')+
    '<div class="pv-sign">'+signs.map(function(sg){return '<div><b>'+sg+'</b><i>(Ký, họ tên)</i><div class="sp"></div></div>';}).join('')+'</div>'+
  '</div>';

/* ---------- KIỂM KÊ ---------- */
var ST={whId:null, counts:{}, q:'', onlyStock:true};
RENDERERS.stocktake=function(c){
  var whs=activeWarehouses();
  if(!whs.length){ c.innerHTML='<div class="card"><div class="empty">Chưa có kho nào — hãy tạo kho trước khi kiểm kê</div></div>'; return; }
  if(!ST.whId || !whById(ST.whId)) ST.whId=whs[0].id;
  c.innerHTML=
  '<div class="card" style="padding:12px 16px;font-size:13px">📋 <b>Kiểm kê kho:</b> nhập số lượng <b>thực đếm</b> cho các mặt hàng có chênh lệch so với sổ sách, sau đó bấm <b>Tạo phiếu điều chỉnh</b>. Tồn kho sẽ được điều chỉnh đúng bằng số thực đếm, có lưu vết đầy đủ.</div>'+
  '<div class="toolbar">'+
    '<div class="field"><label>Kho kiểm kê</label><select id="st-wh" onchange="stWhChange()">'+whs.map(function(w){return '<option value="'+w.id+'" '+(ST.whId===w.id?'selected':'')+'>'+esc(w.name)+'</option>';}).join('')+'</select></div>'+
    '<div class="field grow"><label>Tìm kiếm</label><input id="st-q" placeholder="Tên hoặc mã sản phẩm…" value="'+esc(ST.q)+'"></div>'+
    '<div class="field"><label>&nbsp;</label><label style="display:flex;align-items:center;gap:6px;font-weight:500;margin:0;padding:8px 0"><input type="checkbox" id="st-only" '+(ST.onlyStock?'checked':'')+' onchange="ST.onlyStock=this.checked;stRows()"> Chỉ hàng có tồn</label></div>'+
    '<div class="toolbar-right"><button class="btn btn-primary" onclick="stCreateAdjust()" id="st-btn">📋 Tạo phiếu điều chỉnh (0)</button></div>'+
  '</div>'+
  '<div class="tbl-wrap tbl-scroll"><table class="tbl"><thead><tr><th>Mã</th><th>Tên sản phẩm</th><th class="c">ĐVT</th><th class="r">Tồn sổ sách</th><th class="r" style="width:130px">Thực đếm</th><th class="r">Chênh lệch</th></tr></thead><tbody id="st-tbody"></tbody></table></div>';
  $('#st-q').addEventListener('input', function(){ ST.q=this.value; stRows(); });
  stRows();
};
function stWhChange(){
  var nv=$('#st-wh').value;
  if(Object.keys(ST.counts).length){
    if(!confirm('Đổi kho sẽ xóa các số liệu thực đếm đang nhập. Tiếp tục?')){ $('#st-wh').value=ST.whId; return; }
  }
  ST.whId=nv; ST.counts={}; stRows(); stUpdateBtn();
}
function stRows(){
  var q=normStr(ST.q);
  var list=activeProducts().filter(function(p){
    if(ST.onlyStock && getStock(ST.whId,p.id)<=0 && ST.counts[p.id]===undefined) return false;
    if(q && normStr(p.name).indexOf(q)<0 && normStr(p.sku).indexOf(q)<0 && normStr(p.brand).indexOf(q)<0) return false;
    return true;
  }).sort(function(a,b){return a.sku.localeCompare(b.sku,'vi');}).slice(0,400);
  var html=list.map(function(p){
    var book=getStock(ST.whId,p.id);
    var entered=ST.counts[p.id];
    var actual=entered===undefined?book:parseNum(entered);
    var delta=round3(actual-book);
    return '<tr>'+
      '<td><b>'+esc(p.sku)+'</b></td><td>'+esc(p.name)+'</td><td class="c">'+esc(p.unit)+'</td>'+
      '<td class="r">'+fmtQty(book)+'</td>'+
      '<td><input type="number" step="any" min="0" style="text-align:right" value="'+(entered===undefined?book:entered)+'" oninput="stSetCount(\''+p.id+'\',this.value)"></td>'+
      '<td class="r" id="st-delta-'+p.id+'">'+stDeltaHTML(delta)+'</td>'+
    '</tr>';
  }).join('');
  $('#st-tbody').innerHTML=html||'<tr><td colspan="6"><div class="empty">Không có sản phẩm phù hợp</div></td></tr>';
  stUpdateBtn();
}
function stDeltaHTML(delta){
  if(Math.abs(delta)<1e-9) return '<span class="muted">0</span>';
  return '<b class="'+(delta>0?'num-pos':'num-neg')+'">'+(delta>0?'+':'')+fmtQty(delta)+'</b>';
}
function stSetCount(pid,val){
  var book=getStock(ST.whId,pid);
  if(String(val).trim()===''){ delete ST.counts[pid]; }
  else {
    ST.counts[pid]=val;
    if(Math.abs(parseNum(val)-book)<1e-9) delete ST.counts[pid];
  }
  var delta=(ST.counts[pid]===undefined)?0:round3(parseNum(val)-book);
  var el=$('#st-delta-'+pid); if(el) el.innerHTML=stDeltaHTML(delta);
  stUpdateBtn();
}
function stDiffLines(){
  var lines=[];
  for(var pid in ST.counts){
    var book=getStock(ST.whId,pid);
    var delta=round3(parseNum(ST.counts[pid])-book);
    if(Math.abs(delta)>1e-9) lines.push({productId:pid, qty:delta, book:book, actual:parseNum(ST.counts[pid])});
  }
  return lines;
}
function stUpdateBtn(){
  var btn=$('#st-btn'); if(btn) btn.textContent='📋 Tạo phiếu điều chỉnh ('+stDiffLines().length+')';
}
function stCreateAdjust(){
  var lines=stDiffLines();
  if(!lines.length) return toast('Chưa có mặt hàng nào chênh lệch so với sổ sách','warn');
  var rows=lines.map(function(l){
    var p=prodById(l.productId);
    return '<tr><td>'+esc(p.name)+'</td><td class="r">'+fmtQty(l.book)+'</td><td class="r">'+fmtQty(l.actual)+'</td><td class="r">'+stDeltaHTML(l.qty)+'</td></tr>';
  }).join('');
  openModal({
    title:'Xác nhận điều chỉnh kiểm kê — '+whName(ST.whId), size:'md',
    body:'<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Sản phẩm</th><th class="r">Sổ sách</th><th class="r">Thực đếm</th><th class="r">Chênh lệch</th></tr></thead><tbody>'+rows+'</tbody></table></div>'+
      '<div class="field" style="margin-top:12px"><label>Ghi chú kiểm kê</label><input id="st-note" value="Kiểm kê định kỳ ngày '+fmtDate(todayStr())+'"></div>',
    footer:'<button class="btn btn-ghost" onclick="closeModal()">Hủy</button><button class="btn btn-primary" onclick="stConfirmAdjust()">Xác nhận điều chỉnh</button>'
  });
}
function stConfirmAdjust(){
  var lines=stDiffLines();
  var res=postVoucher({type:'adjust', date:todayStr(), warehouseId:ST.whId, note:($('#st-note').value||'').trim(), lines:lines});
  closeModal();
  if(!res.ok) return toast(res.error,'error');
  ST.counts={};
  toast('Đã tạo phiếu điều chỉnh '+res.voucher.code+' — tồn kho đã cập nhật theo thực đếm','success');
  refreshPage();
}
</script>

<script>
'use strict';
/* ==================== THU CHI & CÔNG NỢ ==================== */

var FIN={tab:'pay', type:'', q:''};

RENDERERS.finance=function(c){
  var t=FIN.tab;
  c.innerHTML=
  '<div class="tabs">'+
    '<div class="tab '+(t==='pay'?'active':'')+'" onclick="FIN.tab=\'pay\';refreshPage()">💳 Phiếu thu / chi</div>'+
    '<div class="tab '+(t==='sup'?'active':'')+'" onclick="FIN.tab=\'sup\';refreshPage()">📉 Công nợ nhà cung cấp</div>'+
    '<div class="tab '+(t==='cus'?'active':'')+'" onclick="FIN.tab=\'cus\';refreshPage()">📈 Công nợ khách hàng</div>'+
  '</div>'+

  else finDebtTab(t==='sup'?'supplier':'customer');
};

/* ---------- TAB PHIẾU THU / CHI ---------- */
function finPayTab(){
  var box=$('#fin-body');
  box.innerHTML=
  '<div class="toolbar">'+
    '<div class="field"><label>Loại phiếu</label><select id="fin-type" onchange="FIN.type=this.value;finPayRows()"><option value="">— Tất cả —</option><option value="receipt" '+(FIN.type==='receipt'?'selected':'')+'>💰 Phiếu thu</option><option value="payment" '+(FIN.type==='payment'?'selected':'')+'>💸 Phiếu chi</option></select></div>'+
    '<div class="field grow"><label>Tìm kiếm</label><input id="fin-q" placeholder="Số phiếu, đối tác, ghi chú…" value="'+esc(FIN.q)+'"></div>'+
    '<div class="toolbar-right">'+
      '<button class="btn btn-ghost btn-sm" onclick="exportPayments()">📊 Xuất Excel</button>'+
      '<button class="btn btn-success btn-sm" onclick="paymentForm(\'receipt\')">＋ Lập phiếu thu</button>'+
      '<button class="btn btn-primary btn-sm" onclick="paymentForm(\'payment\')">＋ Lập phiếu chi</button>'+
    '</div>'+
  '</div>'+
  '<div class="tbl-wrap tbl-scroll"><table class="tbl"><thead><tr>'+
    '<th>Số phiếu</th><th>Ngày</th><th>Đối tác</th><th class="c">Phương thức</th><th class="r">Số tiền (đ)</th><th>Ghi chú</th><th>Người lập</th><th class="c">Trạng thái</th>'+
  '</tr></thead><tbody id="fin-tbody"></tbody></table></div>'+
  '<div class="pagin" id="fin-count"></div>';
  $('#fin-q').addEventListener('input', function(){ FIN.q=this.value; finPayRows(); });
  finPayRows();
}
function finPayRows(){
  var q=normStr(FIN.q);
  var list=DB.payments.filter(function(pm){
    if(FIN.type && pm.type!==FIN.type) return false;
    if(q && normStr(pm.code).indexOf(q)<0 && normStr(partnerName(pm.partnerId)).indexOf(q)<0 && normStr(pm.note).indexOf(q)<0) return false;
    return true;
  });
  var shown=list.slice(0,200);
  var html=shown.map(function(pm){
    var pt=PTYPES[pm.type];
    var isVoid=pm.status==='void';
    return '<tr class="click" onclick="paymentDetail(\''+pm.id+'\')">'+
      '<td><span class="badge" style="background:'+pt.color+'1a;color:'+pt.color+'">'+pt.icon+' '+esc(pm.code)+'</span></td>'+
      '<td>'+fmtDate(pm.date)+'</td>'+
      '<td>'+esc(partnerName(pm.partnerId))+'</td>'+
      '<td class="c">'+(pm.method==='bank'?'🏦 Chuyển khoản':'💵 Tiền mặt')+'</td>'+
      '<td class="r"'+(isVoid?' style="text-decoration:line-through"':'')+'><b class="'+(pm.type==='receipt'?'num-pos':'num-neg')+'">'+(pm.type==='receipt'?'+':'−')+fmtMoney(pm.amount)+'</b></td>'+
      '<td class="muted small">'+esc(pm.note||'')+'</td>'+
      '<td class="muted">'+esc(pm.createdBy)+'</td>'+
      '<td class="c">'+(isVoid?'<span class="tag tag-red">Đã hủy</span>':'<span class="tag tag-green">Đã ghi sổ</span>')+'</td>'+
    '</tr>';
  }).join('');
  $('#fin-tbody').innerHTML=html||'<tr><td colspan="8"><div class="empty">Chưa có phiếu thu / chi nào. Lập phiếu thu khi nhận tiền, phiếu chi khi trả tiền cho đối tác.</div></td></tr>';
  $('#fin-count').textContent='Hiển thị '+shown.length+' / '+list.length+' phiếu';
}

/* ---------- FORM PHIẾU THU / CHI ---------- */
function paymentForm(type, partnerId, amount){
  var pt=PTYPES[type]; if(!pt) return;
  if(!DB.partners.length){ toast('Chưa có đối tác nào — hãy thêm nhà cung cấp / khách hàng trước','warn'); return; }
  var sups=activePartners('supplier'), cuss=activePartners('customer');
  // Phiếu thu thường từ khách hàng, phiếu chi thường cho NCC → nhóm ưu tiên lên trước
  function opts(list,label){
    if(!list.length) return '';
    return '<optgroup label="'+label+'">'+list.map(function(p){
      var debt=partnerDebt(p.id);
      return '<option value="'+p.id+'" '+(partnerId===p.id?'selected':'')+'>'+esc(p.name)+(Math.abs(debt)>0.005?' — nợ '+fmtMoney(debt)+' đ':'')+'</option>';
    }).join('')+'</optgroup>';
  }
  var partnerOpts = type==='receipt'
    ? opts(cuss,'Khách hàng (thu nợ)')+opts(sups,'Nhà cung cấp (NCC hoàn tiền)')
    : opts(sups,'Nhà cung cấp (trả nợ)')+opts(cuss,'Khách hàng (hoàn tiền khách)');
  openModal({
    title:pt.icon+' Lập '+pt.name.toLowerCase(), size:'sm',
    body:
      '<div class="field"><label>Ngày chứng từ <span class="req">*</span></label><input type="date" id="pmf-date" value="'+todayStr()+'"></div>'+
      '<div class="field"><label>Đối tác <span class="req">*</span></label><select id="pmf-partner">'+(partnerId?'':'<option value="">— Chọn đối tác —</option>')+partnerOpts+'</select></div>'+
      '<div class="field"><label>Số tiền (đ) <span class="req">*</span></label><input type="number" min="0" step="any" id="pmf-amount" style="text-align:right;font-size:16px;font-weight:700" value="'+(amount?round2(amount):'')+'" placeholder="0"></div>'+
      '<div class="field"><label>Phương thức</label><select id="pmf-method"><option value="cash">💵 Tiền mặt</option><option value="bank">🏦 Chuyển khoản</option></select></div>'+
      '<div class="field"><label>Lý do / Ghi chú</label><input id="pmf-note" placeholder="'+(type==='receipt'?'Thu nợ theo phiếu xuất…':'Thanh toán nợ nhà cung cấp…')+'"></div>',
    footer:
      '<button class="btn btn-ghost" onclick="closeModal()">Hủy</button>'+
      '<button class="btn btn-ghost" onclick="savePayment(\''+type+'\',true)">💾 Lưu &amp; In</button>'+
      '<button class="btn '+(type==='receipt'?'btn-success':'btn-primary')+'" onclick="savePayment(\''+type+'\',false)">💾 Lưu phiếu</button>'
  });
}
function savePayment(type, doPrint){
  var res=postPayment({
    type:type,
    date:$('#pmf-date').value,
    partnerId:$('#pmf-partner').value||null,
    amount:parseNum($('#pmf-amount').value),
    method:$('#pmf-method').value,
    note:($('#pmf-note').value||'').trim()
  });
  if(!res.ok) return toast(res.error,'error');
  closeModal();
  toast('Đã lưu '+PTYPES[type].name.toLowerCase()+' số '+res.payment.code,'success');
  if(CURRENT_PAGE==='finance') refreshPage(); else if(CURRENT_PAGE==='dashboard') refreshPage();
  if(doPrint) printPayment(res.payment.id);
}

/* ---------- CHI TIẾT / HỦY / XÓA PHIẾU THU CHI ---------- */
function paymentDetail(id){
  var pm=DB.payments.find(function(x){return x.id===id;}); if(!pm) return;
  var pt=PTYPES[pm.type];
  var p=partnerById(pm.partnerId);
  openModal({
    title:pt.icon+' '+pt.name+' — '+pm.code, size:'sm',
    body:
      '<div style="font-size:14px;line-height:2.1">'+
        '<div>Ngày chứng từ: <b>'+fmtDate(pm.date)+'</b></div>'+
        '<div>'+(pm.type==='receipt'?'Thu từ':'Chi cho')+': <b>'+esc(partnerName(pm.partnerId))+'</b>'+(p?' <span class="tag">'+(p.type==='supplier'?'NCC':'Khách hàng')+'</span>':'')+'</div>'+
        '<div>Số tiền: <b style="font-size:18px" class="'+(pm.type==='receipt'?'num-pos':'num-neg')+'">'+fmtMoney(pm.amount)+' đ</b></div>'+
        '<div class="small muted">Bằng chữ: '+esc(docSoTien(pm.amount))+'</div>'+
        '<div>Phương thức: <b>'+(pm.method==='bank'?'Chuyển khoản':'Tiền mặt')+'</b></div>'+
        (pm.note?'<div>Ghi chú: '+esc(pm.note)+'</div>':'')+
        '<div class="small muted">Người lập: '+esc(pm.createdBy)+' — '+fmtDateTime(pm.createdAt)+'</div>'+
        (pm.status==='void'?'<div class="banner banner-warn" style="margin-top:8px">⛔ Phiếu đã bị hủy bởi <b>'+esc(pm.voidedBy||'')+'</b> lúc '+fmtDateTime(pm.voidedAt)+' — không còn tính vào công nợ.</div>':'')+
      '</div>',
    footer:
      '<button class="btn btn-ghost" onclick="closeModal()">Đóng</button>'+
      (isAdmin()?'<button class="btn btn-danger" onclick="askDeletePayment(\''+pm.id+'\')">🗑️ Xóa</button>':'')+
      (pm.status!=='void'&&isMgr()?'<button class="btn btn-danger" onclick="askVoidPayment(\''+pm.id+'\')">⛔ Hủy phiếu</button>':'')+
      (pm.status!=='void'?'<button class="btn btn-primary" onclick="printPayment(\''+pm.id+'\')">🖨️ In phiếu</button>':'')
  });
}
function askVoidPayment(id){
  var pm=DB.payments.find(function(x){return x.id===id;}); if(!pm) return;
  confirmDlg('Hủy phiếu '+pm.code,'Hủy phiếu sẽ <b>loại khoản tiền này khỏi công nợ</b>. Phiếu vẫn được giữ trong danh sách với trạng thái "Đã hủy" để tra cứu.<br><br>Bạn chắc chắn muốn hủy?','Hủy phiếu',function(){
    var res=voidPayment(id);
    if(!res.ok) return toast(res.error,'error');
    toast('Đã hủy phiếu '+pm.code,'success');
    refreshPage();
  }, true);
}
function askDeletePayment(id){
  if(!isAdmin()) return toast('Chỉ Quản trị viên mới được xóa phiếu','warn');
  var pm=DB.payments.find(function(x){return x.id===id;}); if(!pm) return;
  confirmDlg('🗑️ Xóa phiếu '+pm.code,'Xóa vĩnh viễn phiếu <b>'+esc(pm.code)+'</b> ('+fmtMoney(pm.amount)+' đ) khỏi danh sách — không thể khôi phục và số phiếu sẽ bị khuyết.<br><br>Bạn chắc chắn?','Xóa vĩnh viễn',function(){
    var res=deletePayment(id);
    if(!res.ok) return toast(res.error,'error');
    toast('Đã xóa phiếu '+pm.code,'success');
    refreshPage();
  }, true);
}

/* ---------- IN PHIẾU THU / CHI ---------- */
function printPayment(id){
  var pm=DB.payments.find(function(x){return x.id===id;}); if(!pm) return;
  var s=DB.settings||{};
  var p=partnerById(pm.partnerId);
  var d=pm.date.split('-');
  var isRc=pm.type==='receipt';
  $('#print-area').innerHTML=
  '<div class="pv">'+
    '<div class="pv-head">'+
      '<div class="co"><b>'+esc(s.companyName||'CÔNG TY')+'</b><br>'+esc(s.companyAddress||'')+(s.companyPhone?'<br>ĐT: '+esc(s.companyPhone):'')+(s.companyTax?'<br>MST: '+esc(s.companyTax):'')+'</div>'+
      '<div style="text-align:right">Số: <b>'+esc(pm.code)+'</b><br><i>Ngày '+d[2]+' tháng '+d[1]+' năm '+d[0]+'</i></div>'+
    '</div>'+
    '<h1>'+(isRc?'PHIẾU THU':'PHIẾU CHI')+'</h1>'+
    '<div class="pv-code">Người lập: '+esc(pm.createdBy)+(pm.status==='void'?' — <b>PHIẾU ĐÃ HỦY</b>':'')+'</div>'+
    '<div class="pv-info">'+
      '<div>Họ tên người '+(isRc?'nộp':'nhận')+' tiền: <b>'+esc(partnerName(pm.partnerId))+'</b></div>'+
      (p&&p.address?'<div>Địa chỉ: '+esc(p.address)+'</div>':'')+
      '<div>Lý do '+(isRc?'thu':'chi')+': '+esc(pm.note||(isRc?'Thu nợ khách hàng':'Thanh toán nợ nhà cung cấp'))+'</div>'+
      '<div>Số tiền: <b style="font-size:15px">'+fmtMoney(pm.amount)+' đ</b> ('+(pm.method==='bank'?'chuyển khoản':'tiền mặt')+')</div>'+
      '<div><i>Bằng chữ: <b>'+docSoTien(pm.amount)+'</b></i></div>'+
    '</div>'+
    '<div class="pv-sign">'+['Giám đốc','Kế toán','Thủ quỹ',(isRc?'Người nộp tiền':'Người nhận tiền')].map(function(sg){return '<div><b>'+sg+'</b><i>(Ký, họ tên)</i><div class="sp"></div></div>';}).join('')+'</div>'+
  '</div>';
  window.print();
}

/* ---------- TAB CÔNG NỢ ---------- */
function finDebtTab(type){
  var isSup=type==='supplier';
  var rows=debtSummary(type);
  var totalOwe=0, totalOver=0;
  rows.forEach(function(r){ if(r.balance>0) totalOwe+=r.balance; else totalOver+=(-r.balance); });
  var html=rows.map(function(r){
    var b=r.balance;
    return '<tr class="click" onclick="debtStatement(\''+r.partner.id+'\')">'+
      '<td><b>'+esc(r.partner.code)+'</b></td>'+
      '<td>'+esc(r.partner.name)+(r.partner.phone?'<div class="small muted">'+esc(r.partner.phone)+'</div>':'')+'</td>'+
      '<td class="r">'+fmtMoney(r.gross)+'</td>'+
      '<td class="r">'+(r.returned?fmtMoney(r.returned):'<span class="muted">—</span>')+'</td>'+
      '<td class="r">'+fmtMoney(r.paidNet)+'</td>'+
      '<td class="r">'+(Math.abs(b)<0.005?'<span class="tag tag-green">✓ Hết nợ</span>':b>0?'<b class="num-neg">'+fmtMoney(b)+'</b>':'<b style="color:var(--amber)">'+fmtMoney(-b)+' (trả thừa)</b>')+'</td>'+
      '<td class="c" style="white-space:nowrap">'+
        '<button class="btn btn-xs btn-ghost" onclick="event.stopPropagation();debtStatement(\''+r.partner.id+'\')">Sổ chi tiết</button> '+
        (b>0.005?'<button class="btn btn-xs '+(isSup?'btn-primary':'btn-ghost')+'" onclick="event.stopPropagation();paymentForm(\''+(isSup?'payment':'receipt')+'\',\''+r.partner.id+'\','+b+')">'+(isSup?'💸 Trả nợ':'💰 Thu nợ')+'</button>':'')+
      '</td>'+
    '</tr>';
  }).join('');
  $('#fin-body').innerHTML=
  '<div class="kpis" style="grid-template-columns:repeat(auto-fit,minmax(260px,1fr))">'+
    '<div class="kpi"><div class="ic" style="background:'+(isSup?'#fff7ed':'#eff6ff')+'">'+(isSup?'💸':'💰')+'</div><div><div class="v '+(totalOwe>0?'num-neg':'')+'">'+fmtMoney(totalOwe)+' đ</div><div class="l">'+(isSup?'Tổng còn phải trả nhà cung cấp':'Tổng còn phải thu khách hàng')+'</div></div></div>'+
    (totalOver>0.005?'<div class="kpi"><div class="ic" style="background:#fffbeb">⚖️</div><div><div class="v" style="color:var(--amber)">'+fmtMoney(totalOver)+' đ</div><div class="l">'+(isSup?'NCC đang giữ thừa của ta':'Ta đang giữ thừa của khách')+'</div></div></div>':'')+
  '</div>'+
  '<div class="toolbar"><div class="grow" style="font-size:13px;color:var(--muted)">Bấm vào từng dòng để xem <b>sổ chi tiết công nợ</b> theo thời gian. Số liệu tính từ các phiếu đã ghi sổ và phiếu thu / chi.</div>'+
    '<div class="toolbar-right"><button class="btn btn-ghost btn-sm" onclick="exportDebts(\''+type+'\')">📊 Xuất Excel</button></div></div>'+
  '<div class="tbl-wrap tbl-scroll"><table class="tbl"><thead><tr>'+
    '<th>Mã</th><th>'+(isSup?'Nhà cung cấp':'Khách hàng')+'</th><th class="r">'+(isSup?'Tổng mua (đ)':'Tổng bán (đ)')+'</th><th class="r">Trả hàng (đ)</th><th class="r">Đã thanh toán (đ)</th><th class="r">'+(isSup?'Còn phải trả (đ)':'Còn phải thu (đ)')+'</th><th class="c">Thao tác</th>'+
  '</tr></thead><tbody>'+(html||'<tr><td colspan="7"><div class="empty">Chưa phát sinh công nợ với '+(isSup?'nhà cung cấp':'khách hàng')+' nào</div></td></tr>')+'</tbody></table></div>';
}

/* ---------- SỔ CHI TIẾT CÔNG NỢ ĐỐI TÁC ---------- */
function debtStatement(partnerId){
  var p=partnerById(partnerId); if(!p) return;
  var isSup=p.type==='supplier';
  var entries=partnerStatement(partnerId);
  var bal=entries.length?entries[entries.length-1].balance:0;
  var rows=entries.map(function(e){
    return '<tr class="click" onclick="'+(e.kind==='voucher'?'closeModal();voucherDetail(\''+e.id+'\')':'closeModal();paymentDetail(\''+e.id+'\')')+'">'+
      '<td>'+fmtDate(e.date)+'</td>'+
      '<td><b>'+esc(e.code)+'</b></td>'+
      '<td>'+e.label+'</td>'+
      '<td class="r">'+fmtMoney(e.total)+'</td>'+
      '<td class="r">'+(e.delta>0?'<b class="num-neg">+'+fmtMoney(e.delta)+'</b>':e.delta<0?'<b class="num-pos">−'+fmtMoney(-e.delta)+'</b>':'<span class="muted">0</span>')+'</td>'+
      '<td class="r"><b>'+fmtMoney(e.balance)+'</b></td>'+
    '</tr>';
  }).join('');
  openModal({
    title:'📒 Sổ công nợ — '+p.name, size:'lg',
    body:
      '<div style="display:flex;gap:20px;flex-wrap:wrap;margin-bottom:13px;font-size:13.5px;align-items:center">'+
        '<span class="tag">'+(isSup?'Nhà cung cấp':'Khách hàng')+' · '+esc(p.code)+'</span>'+
        (p.phone?'<span class="muted">☎ '+esc(p.phone)+'</span>':'')+
        '<span style="margin-left:auto">'+(isSup?'Còn phải trả':'Còn phải thu')+': <b style="font-size:16px" class="'+(bal>0.005?'num-neg':'num-pos')+'">'+fmtMoney(bal)+' đ</b></span>'+
      '</div>'+
      (entries.length?'<div class="tbl-wrap" style="max-height:52vh;overflow:auto"><table class="tbl"><thead><tr>'+
        '<th>Ngày</th><th>Chứng từ</th><th>Loại</th><th class="r">Giá trị (đ)</th><th class="r">Phát sinh nợ (đ)</th><th class="r">Số dư (đ)</th>'+
      '</tr></thead><tbody>'+rows+'</tbody></table></div><div class="small muted" style="margin-top:8px">Phát sinh dương = tăng nợ · âm = giảm nợ (thanh toán / trả hàng). Bấm vào dòng để mở chứng từ gốc.</div>'
      :'<div class="empty">Chưa có phát sinh nào với đối tác này</div>'),
    footer:
      '<button class="btn btn-ghost" onclick="closeModal()">Đóng</button>'+
      '<button class="btn btn-success" onclick="closeModal();paymentForm(\'receipt\',\''+p.id+'\','+((!isSup&&bal>0.005)?bal:(isSup&&bal<-0.005)?-bal:0)+')">💰 Lập phiếu thu</button>'+
      '<button class="btn btn-primary" onclick="closeModal();paymentForm(\'payment\',\''+p.id+'\','+((isSup&&bal>0.005)?bal:(!isSup&&bal<-0.005)?-bal:0)+')">💸 Lập phiếu chi</button>'
  });
}

/* ---------- XUẤT EXCEL ---------- */
function exportPayments(){
  var rows=[['Số phiếu','Loại','Ngày','Đối tác','Phương thức','Số tiền','Ghi chú','Người lập','Trạng thái']];
  DB.payments.forEach(function(pm){
    rows.push([pm.code, PTYPES[pm.type].name, pm.date, partnerName(pm.partnerId), pm.method==='bank'?'Chuyển khoản':'Tiền mặt', pm.amount, pm.note||'', pm.createdBy, pm.status==='void'?'Đã hủy':'Đã ghi sổ']);
  });
  xlsxExport('phieu-thu-chi-'+todayStr(), [{name:'ThuChi', rows:rows}]);
}
function exportDebts(type){
  var isSup=type==='supplier';
  var rows=[['Mã','Tên '+(isSup?'nhà cung cấp':'khách hàng'),'Điện thoại',(isSup?'Tổng mua':'Tổng bán'),'Trả hàng','Đã thanh toán',(isSup?'Còn phải trả':'Còn phải thu')]];
  debtSummary(type).forEach(function(r){
    rows.push([r.partner.code, r.partner.name, r.partner.phone||'', r.gross, r.returned, r.paidNet, r.balance]);
  });
  xlsxExport('cong-no-'+(isSup?'ncc':'khach-hang')+'-'+todayStr(), [{name:'CongNo', rows:rows}]);
}
</script>

<script>
'use strict';
/* ==================== THEO DÕI: TỒN KHO / LỊCH SỬ / BÁO CÁO ==================== */

/* ---------- TỒN KHO ---------- */
var INVF={q:'', cat:'', wh:'', lowOnly:false};
RENDERERS.inventory=function(c){
  var whs=activeWarehouses();
  c.innerHTML=
  '<div class="toolbar">'+
    '<div class="field grow"><label>Tìm kiếm</label><input id="inv-q" placeholder="Tên, mã hoặc hãng…" value="'+esc(INVF.q)+'"></div>'+
    '<div class="field"><label>Nhóm hàng</label><select id="inv-cat" onchange="invFilter()">'+catOptions(INVF.cat,true)+'</select></div>'+
    '<div class="field"><label>Kho</label><select id="inv-wh" onchange="invFilter()"><option value="">— Tất cả các kho —</option>'+whs.map(function(w){return '<option value="'+w.id+'" '+(INVF.wh===w.id?'selected':'')+'>'+esc(w.name)+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>&nbsp;</label><label style="display:flex;align-items:center;gap:6px;font-weight:500;margin:0;padding:8px 0"><input type="checkbox" id="inv-low" '+(INVF.lowOnly?'checked':'')+' onchange="invFilter()"> ⚠️ Chỉ hàng dưới tồn tối thiểu</label></div>'+
    '<div class="toolbar-right"><button class="btn btn-ghost btn-sm" onclick="exportInventory()">📊 Xuất Excel</button></div>'+
  '</div>'+
  '<div id="inv-table"></div>';
  $('#inv-q').addEventListener('input', invFilter);
  invTable();
};
function invFilter(){
  INVF.q=$('#inv-q').value; INVF.cat=$('#inv-cat').value; INVF.wh=$('#inv-wh').value; INVF.lowOnly=$('#inv-low').checked;
  invTable();
}
function invRowsData(){
  var q=normStr(INVF.q);
  return DB.products.filter(function(p){
    if(p.active===false && totalStock(p.id)<=0) return false;
    if(INVF.cat && p.categoryId!==INVF.cat) return false;
    if(q && normStr(p.name).indexOf(q)<0 && normStr(p.sku).indexOf(q)<0 && normStr(p.brand).indexOf(q)<0) return false;
    if(INVF.lowOnly && !((p.minStock||0)>0 && totalStock(p.id)<p.minStock)) return false;
    return true;
  }).sort(function(a,b){return a.sku.localeCompare(b.sku,'vi');});
}
function invTable(){
  var whs=activeWarehouses();
  var showAll=!INVF.wh;
  var list=invRowsData();
  var totalVal=0;
  var rows=list.slice(0,400).map(function(p){
    var tot=totalStock(p.id);
    var qty=showAll?tot:getStock(INVF.wh,p.id);
    var val=qty*(p.costPrice||0); totalVal+=val;
    var low=(p.minStock||0)>0 && tot<p.minStock;
    return '<tr>'+
      '<td><b>'+esc(p.sku)+'</b></td>'+
      '<td>'+esc(p.name)+(p.active===false?' <span class="tag tag-gray">Ngừng KD</span>':'')+(p.brand?'<div class="small muted">'+esc(p.brand)+'</div>':'')+'</td>'+
      '<td class="c">'+esc(p.unit)+'</td>'+
      (showAll?whs.map(function(w){ var s=getStock(w.id,p.id); return '<td class="r'+(s?'':' muted')+'">'+(s?fmtQty(s):'·')+'</td>'; }).join(''):'')+
      '<td class="r"><b class="'+(low?'low-flag':'')+'">'+fmtQty(qty)+(low?' ⚠️':'')+'</b></td>'+
      '<td class="r muted">'+fmtMoney(p.costPrice)+'</td>'+
      '<td class="r">'+fmtMoney(val)+'</td>'+
      '<td class="r muted">'+(p.minStock?fmtQty(p.minStock):'—')+'</td>'+
    '</tr>';
  }).join('');
  var colCount=(showAll?whs.length:0)+7;
  $('#inv-table').innerHTML=
  '<div class="tbl-wrap tbl-scroll"><table class="tbl"><thead><tr>'+
    '<th>Mã</th><th>Tên sản phẩm</th><th class="c">ĐVT</th>'+
    (showAll?whs.map(function(w){return '<th class="r">'+esc(w.name)+'</th>';}).join(''):'')+
    '<th class="r">'+(showAll?'Tổng tồn':'Tồn tại kho')+'</th><th class="r">Giá vốn (đ)</th><th class="r">Giá trị tồn (đ)</th><th class="r">Tồn min</th>'+
  '</tr></thead><tbody>'+(rows||'<tr><td colspan="'+colCount+'"><div class="empty">Không có dữ liệu tồn kho phù hợp</div></td></tr>')+'</tbody>'+
  '<tfoot><tr><td colspan="'+(colCount-2)+'" class="r">TỔNG GIÁ TRỊ TỒN'+(showAll?' (toàn công ty)':' ('+esc(whName(INVF.wh))+')')+'</td><td class="r" style="color:var(--primary)">'+fmtMoney(totalVal)+'</td><td></td></tr></tfoot>'+
  '</table></div>'+
  '<div class="pagin">'+list.length+' mặt hàng'+(list.length>400?' (hiển thị 400 đầu tiên — dùng bộ lọc để thu hẹp)':'')+'</div>';
}

/* ---------- LỊCH SỬ PHIẾU ---------- */
var HISTF={type:'', wh:'', from:'', to:'', q:'', page:0};
RENDERERS.history=function(c){
  var whs=DB.warehouses;
  c.innerHTML=
  '<div class="toolbar">'+
    '<div class="field"><label>Loại phiếu</label><select id="hf-type" onchange="histFilter()"><option value="">— Tất cả —</option>'+
      Object.keys(VTYPES).map(function(t){return '<option value="'+t+'" '+(HISTF.type===t?'selected':'')+'>'+VTYPES[t].icon+' '+VTYPES[t].name+'</option>';}).join('')+
    '</select></div>'+
    '<div class="field"><label>Kho</label><select id="hf-wh" onchange="histFilter()"><option value="">— Tất cả —</option>'+whs.map(function(w){return '<option value="'+w.id+'" '+(HISTF.wh===w.id?'selected':'')+'>'+esc(w.name)+'</option>';}).join('')+'</select></div>'+
    '<div class="field"><label>Từ ngày</label><input type="date" id="hf-from" value="'+HISTF.from+'" onchange="histFilter()"></div>'+
    '<div class="field"><label>Đến ngày</label><input type="date" id="hf-to" value="'+HISTF.to+'" onchange="histFilter()"></div>'+
    '<div class="field grow"><label>Tìm kiếm</label><input id="hf-q" placeholder="Số phiếu, đối tác, người lập, sản phẩm…" value="'+esc(HISTF.q)+'"></div>'+
    '<div class="toolbar-right"><button class="btn btn-ghost btn-sm" onclick="exportHistory()">📊 Xuất Excel</button></div>'+
  '</div>'+
  '<div id="hist-table"></div>';
  $('#hf-q').addEventListener('input', function(){ HISTF.q=this.value; HISTF.page=0; histTable(); });
  histTable();
};
function histFilter(){
  HISTF.type=$('#hf-type').value; HISTF.wh=$('#hf-wh').value;
  HISTF.from=$('#hf-from').value; HISTF.to=$('#hf-to').value;
  HISTF.page=0; histTable();
}
function histData(){
  var q=normStr(HISTF.q);
  return DB.vouchers.filter(function(v){
    if(HISTF.type && v.type!==HISTF.type) return false;
    if(HISTF.wh && v.warehouseId!==HISTF.wh && v.toWarehouseId!==HISTF.wh) return false;
    if(HISTF.from && v.date<HISTF.from) return false;
    if(HISTF.to && v.date>HISTF.to) return false;
    if(q){
      var hay=normStr(v.code+' '+(v.partnerId?partnerName(v.partnerId):'')+' '+v.createdBy+' '+v.note+' '+v.lines.map(function(l){return l.name+' '+l.sku;}).join(' '));
      if(hay.indexOf(q)<0) return false;
    }
    return true;
  });
}
function histTable(){
  var PAGE=20;
  var list=histData();
  var pages=Math.max(1,Math.ceil(list.length/PAGE));
  if(HISTF.page>=pages) HISTF.page=pages-1;
  var shown=list.slice(HISTF.page*PAGE,(HISTF.page+1)*PAGE);
  var rows=shown.map(function(v){
    var vt=VTYPES[v.type], isVoid=v.status==='void';
    return '<tr class="click" onclick="voucherDetail(\''+v.id+'\')">'+
      '<td><span class="badge" style="background:'+vt.color+'1a;color:'+vt.color+'">'+vt.icon+' '+esc(v.code)+'</span></td>'+
      '<td>'+vt.name+'</td>'+
      '<td>'+fmtDate(v.date)+'</td>'+
      '<td>'+esc(whName(v.warehouseId))+(v.type==='transfer'?' → '+esc(whName(v.toWarehouseId)):'')+'</td>'+
      '<td>'+(v.partnerId?esc(partnerName(v.partnerId)):'<span class="muted">—</span>')+'</td>'+

  $('#hist-table').innerHTML=

}

}
function rptPreset(p){
  if(p==='month'){ RPT.from=monthFirst(); RPT.to=todayStr(); }
  else if(p==='lastmonth'){
    var d=new Date(); d.setDate(1); d.setDate(0); // ngày cuối tháng trước
    var last=d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
    RPT.from=last.slice(0,8)+'01'; RPT.to=last;
  }
  else if(p===0){ RPT.from=todayStr(); RPT.to=todayStr(); }
  else { RPT.from=dayOffset(-p+1); RPT.to=todayStr(); }

}
function rptBody(){
  var box=$('#rpt-body'); if(!box) return;

    '<tfoot><tr><td colspan="5" class="r">TỔNG CỘNG</td><td class="r">'+fmtMoney(s.inV)+'</td><td></td><td class="r">'+fmtMoney(s.outV)+'</td><td></td><td class="r" style="color:var(--primary)">'+fmtMoney(s.closeV)+'</td></tr></tfoot></table></div>'+
    '<div class="pagin">Kỳ '+fmtDate(RPT.from)+' – '+fmtDate(RPT.to)+(RPT.wh?' · '+esc(whName(RPT.wh)):' · toàn công ty (chuyển kho nội bộ không tính vào nhập/xuất)')+' · GT nhập theo giá mua thực tế, GT xuất & tồn theo giá vốn bình quân</div>';
}
function rptProfitHTML(){
  var rp=reportProfit(RPT.from, RPT.to);
  var kpi=
  '<div class="kpis">'+
    '<div class="kpi"><div class="ic" style="background:#eff6ff">💵</div><div><div class="v">'+fmtMoney(rp.sum.revenue)+' đ</div><div class="l">Doanh thu thuần (đã trừ hàng trả)</div></div></div>'+

    '<div class="kpi"><div class="ic" style="background:#faf5ff">📈</div><div><div class="v">'+rp.sum.margin.toFixed(1)+'%</div><div class="l">Biên lợi nhuận gộp</div></div></div>'+
  '</div>';
  var rows=rp.rows.map(function(r){
    return '<tr>'+
      '<td><b>'+esc(r.product.sku)+'</b></td><td>'+esc(r.product.name)+'</td>'+
      '<td class="r">'+fmtQty(r.soldQ)+'</td><td class="r">'+(r.returnQ?fmtQty(r.returnQ):'·')+'</td>'+
      '<td class="r">'+fmtMoney(r.revenue)+'</td><td class="r muted">'+fmtMoney(r.cogs)+'</td>'+
      '<td class="r '+(r.profit>=0?'num-pos':'num-neg')+'">'+fmtMoney(r.profit)+'</td>'+
      '<td class="r">'+r.margin.toFixed(1)+'%</td>'+

  }).join('');
  return kpi+
    '<div class="tbl-wrap tbl-scroll"><table class="tbl"><thead><tr>'+
    '<th>Mã</th><th>Tên sản phẩm</th><th class="r">SL bán</th><th class="r">SL trả lại</th><th class="r">Doanh thu (đ)</th><th class="r">Giá vốn (đ)</th><th class="r">Lợi nhuận (đ)</th><th class="r">Biên LN</th>'+
    '</tr></thead><tbody>'+(rows||'<tr><td colspan="8"><div class="empty">Chưa có giao dịch bán hàng trong kỳ này</div></td></tr>')+'</tbody>'+
    '<tfoot><tr><td colspan="4" class="r">TỔNG CỘNG</td><td class="r">'+fmtMoney(rp.sum.revenue)+'</td><td class="r">'+fmtMoney(rp.sum.cogs)+'</td><td class="r '+(rp.sum.profit>=0?'num-pos':'num-neg')+'">'+fmtMoney(rp.sum.profit)+'</td><td class="r">'+rp.sum.margin.toFixed(1)+'%</td></tr></tfoot></table></div>'+
    '<div class="pagin">Kỳ '+fmtDate(RPT.from)+' – '+fmtDate(RPT.to)+' · lợi nhuận gộp = doanh thu bán ra − giá vốn bình quân tại thời điểm xuất</div>';
}
function rptTopHTML(){
  var rp=reportProfit(RPT.from, RPT.to);
  var list=rp.rows.slice().sort(function(a,b){ return RPT.topBy==='qty' ? b.netQ-a.netQ : b.revenue-a.revenue; }).slice(0,10);
  if(!list.length) return '<div class="card"><div class="empty">Chưa có giao dịch bán hàng trong kỳ này</div></div>';
  var max=Math.max.apply(null,list.map(function(r){return RPT.topBy==='qty'?r.netQ:r.revenue;}));
  var rows=list.map(function(r,i){
    var val=RPT.topBy==='qty'?r.netQ:r.revenue;
    var w=max>0?Math.max(2,val/max*100):0;
    return '<div class="top-bar-item">'+
      '<div style="width:22px;font-weight:700;color:var(--muted)">'+(i+1)+'</div>'+
      '<div style="width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"><b>'+esc(r.product.name)+'</b> <span class="muted small">'+esc(r.product.sku)+'</span></div>'+
      '<div class="bar-track"><div class="bar-fill" style="width:'+w+'%"></div></div>'+
      '<div style="width:150px;text-align:right"><b>'+(RPT.topBy==='qty'?fmtQty(r.netQ)+' '+esc(r.product.unit):fmtMoney(r.revenue)+' đ')+'</b><div class="small muted">LN: '+fmtMoney(r.profit)+' đ</div></div>'+
    '</div>';
  }).join('');
  return '<div class="card"><div class="card-title">🏆 Top 10 sản phẩm theo '+(RPT.topBy==='qty'?'số lượng bán':'doanh thu')+' · '+fmtDate(RPT.from)+' – '+fmtDate(RPT.to)+'</div>'+rows+'</div>';
}

<script>
'use strict';
/* ==================== HỆ THỐNG: EXCEL / SAO LƯU / NHẬT KÝ / DASHBOARD / DỮ LIỆU MẪU ==================== */

/* ---------- Tải file & Excel ---------- */
function downloadBlob(content, filename, type){
  var b=content instanceof Blob?content:new Blob([content],{type:type||'application/octet-stream'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(b); a.download=filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function(){ URL.revokeObjectURL(a.href); },3000);
}
function xlsxExport(filename, sheets){
  if(typeof XLSX!=='undefined'){
    var wb=XLSX.utils.book_new();
    sheets.forEach(function(s){
      var ws=XLSX.utils.aoa_to_sheet(s.rows);
      XLSX.utils.book_append_sheet(wb, ws, String(s.name||'Sheet').slice(0,31));
    });
    XLSX.writeFile(wb, filename+'.xlsx');
    toast('Đã xuất file '+filename+'.xlsx','success');
  } else {
    var csv='﻿'+sheets[0].rows.map(function(r){
      return r.map(function(c){
        c=(c===null||c===undefined)?'':String(c);
        return /[",;\n]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c;
      }).join(',');
    }).join('\r\n');
    downloadBlob(csv, filename+'.csv','text/csv;charset=utf-8');
    toast('Chưa tải được thư viện Excel (cần internet lần đầu) — đã xuất CSV thay thế, Excel mở được bình thường','warn');
  }
}
function pickFile(accept, cb){
  var fi=$('#file-input');
  fi.accept=accept;
  fi.onchange=function(){ var f=fi.files[0]; fi.value=''; if(f) cb(f); };
  fi.click();
}
function parseCSV(text){
  text=String(text).replace(/^﻿/,'').replace(/\r\n?/g,'\n');
  var nl=text.indexOf('\n'); var firstLine=nl>=0?text.slice(0,nl):text;
  var delim=(firstLine.split(';').length>firstLine.split(',').length)?';':',';
  var rows=[], row=[], cur='', inQ=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(inQ){
      if(c==='"'){ if(text[i+1]==='"'){cur+='"';i++;} else inQ=false; }
      else cur+=c;
    }
    else if(c==='"') inQ=true;
    else if(c===delim){ row.push(cur); cur=''; }
    else if(c==='\n'){ row.push(cur); rows.push(row); row=[]; cur=''; }
    else cur+=c;
  }
  if(cur!==''||row.length){ row.push(cur); rows.push(row); }
  return rows.filter(function(r){ return r.some(function(c){ return String(c).trim()!==''; }); });
}
function readSheetFile(f, cb){
  var isExcel=/\.(xlsx|xls)$/i.test(f.name);
  if(isExcel){
    if(typeof XLSX==='undefined') return toast('Chưa tải được thư viện Excel (cần internet lần đầu) — hãy lưu file dưới dạng CSV rồi thử lại','error');
    var r=new FileReader();
    r.onload=function(e){
      try{
        var wb=XLSX.read(new Uint8Array(e.target.result),{type:'array'});
        var ws=wb.Sheets[wb.SheetNames[0]];
        cb(XLSX.utils.sheet_to_json(ws,{header:1,defval:''}));
      }catch(err){ toast('Không đọc được file: '+err.message,'error'); }
    };
    r.readAsArrayBuffer(f);
  } else if(/\.csv$/i.test(f.name)){
    var r2=new FileReader();
    r2.onload=function(e){ cb(parseCSV(e.target.result)); };
    r2.readAsText(f,'utf-8');
  } else toast('Chỉ hỗ trợ file .xlsx, .xls hoặc .csv','error');
}
function headerMap(headers, defs){
  // defs: [{key, match:[chuỗi đã normStr]}] → trả {key: colIndex}
  // match bắt đầu bằng '=' nghĩa là so khớp CHÍNH XÁC (tránh trùng chuỗi con, VD '=hang' không khớp 'ma hang')
  var map={};
  headers.forEach(function(h,i){
    var n=normStr(h);
    if(!n) return;
    defs.forEach(function(d){
      if(map[d.key]!==undefined) return;
      if(d.match.some(function(m){ return m.charAt(0)==='=' ? n===m.slice(1) : (n===m || n.indexOf(m)>=0); })) map[d.key]=i;
    });
  });
  return map;
}

/* ---------- Xuất / nhập SẢN PHẨM ---------- */
function exportProducts(){
  var rows=[['Mã hàng','Tên hàng','Hãng','Nhóm hàng','Đơn vị','Giá vốn','Giá bán','Tồn tối thiểu','Tổng tồn','Ghi chú','Trạng thái']];
  DB.products.forEach(function(p){
    rows.push([p.sku, p.name, p.brand||'', catName(p.categoryId), p.unit, p.costPrice||0, p.salePrice||0, p.minStock||0, totalStock(p.id), p.note||'', p.active===false?'Ngừng KD':'Đang bán']);
  });
  xlsxExport('danh-sach-san-pham-'+todayStr(), [{name:'SanPham', rows:rows}]);
}
function importProducts(){
  if(!isMgr()) return;
  openModal({
    title:'Nhập sản phẩm từ Excel', size:'md',
    body:
      '<div style="font-size:13.5px;line-height:1.8">File Excel/CSV cần dòng đầu là tiêu đề cột, gồm:<br>'+
      '<b>Mã hàng</b> (bắt buộc) · <b>Tên hàng</b> (bắt buộc) · Hãng · Nhóm hàng · Đơn vị · Giá vốn · Giá bán · Tồn tối thiểu · Ghi chú<br>'+
      '<span class="muted">— Mã đã tồn tại sẽ được <b>cập nhật</b>, mã mới sẽ được <b>thêm</b>. Nhóm hàng chưa có sẽ tự tạo.<br>— Tồn kho đầu kỳ không nhập ở đây: sau khi có danh mục, hãy tạo <b>Phiếu nhập kho</b> đầu kỳ để tồn và giá vốn được ghi sổ đúng.</span></div>',
    footer:
      '<button class="btn btn-ghost" onclick="downloadProductTemplate()">📄 Tải file mẫu</button>'+
      '<button class="btn btn-primary" onclick="closeModal();pickFile(\'.xlsx,.xls,.csv\',doImportProducts)">Chọn file để nhập…</button>'
  });
}
function downloadProductTemplate(){
  xlsxExport('mau-nhap-san-pham', [{name:'SanPham', rows:[
    ['Mã hàng','Tên hàng','Hãng','Nhóm hàng','Đơn vị','Giá vốn','Giá bán','Tồn tối thiểu','Ghi chú'],
    ['SP0001','Giấy A4 Double A','Double A','Văn phòng phẩm','ream',65000,75000,20,''],
    ['SP0002','Bút bi xanh','Thiên Long','Văn phòng phẩm','cây',3500,5000,50,'Ví dụ — xóa dòng này']
  ]}]);
}
function doImportProducts(f){
  readSheetFile(f, function(aoa){
    if(!aoa || aoa.length<2) return toast('File không có dữ liệu','error');
    var map=headerMap(aoa[0],[
      {key:'sku',  match:['ma hang','ma san pham','sku','ma']},
      {key:'name', match:['ten hang','ten san pham','ten']},
      {key:'brand',match:['=hang','thuong hieu','hang sx','hang san xuat','nha san xuat','brand']},
      {key:'cat',  match:['nhom']},
      {key:'unit', match:['don vi','dvt']},
      {key:'cost', match:['gia von']},
      {key:'sale', match:['gia ban']},
      {key:'min',  match:['ton toi thieu','ton min','toi thieu']},
      {key:'note', match:['ghi chu']}
    ]);
    if(map.sku===undefined||map.name===undefined) return toast('Không tìm thấy cột "Mã hàng" hoặc "Tên hàng" ở dòng tiêu đề','error');
    var added=0, updated=0, errs=[];
    for(var i=1;i<aoa.length;i++){
      var r=aoa[i];
      var sku=String(r[map.sku]||'').trim().toUpperCase();
      var name=String(r[map.name]||'').trim();
      if(!sku&&!name) continue;
      if(!sku||!name){ errs.push('Dòng '+(i+1)+': thiếu mã hoặc tên'); continue; }
      var catId=null;
      if(map.cat!==undefined){
        var cn=String(r[map.cat]||'').trim();
        if(cn){
          var cat=DB.categories.find(function(c){return normStr(c.name)===normStr(cn);});
          if(!cat){ cat={id:uid(), name:cn}; DB.categories.push(cat); }
          catId=cat.id;
        }
      }
      var ex=DB.products.find(function(p){return p.sku.toUpperCase()===sku;});
      if(ex){
        ex.name=name;
        if(map.brand!==undefined && String(r[map.brand]).trim()) ex.brand=String(r[map.brand]).trim();
        if(catId) ex.categoryId=catId;
        if(map.unit!==undefined && String(r[map.unit]).trim()) ex.unit=String(r[map.unit]).trim();
        if(map.sale!==undefined && String(r[map.sale]).trim()!=='') ex.salePrice=parseNum(r[map.sale]);
        if(map.min!==undefined && String(r[map.min]).trim()!=='') ex.minStock=parseNum(r[map.min]);
        if(map.cost!==undefined && String(r[map.cost]).trim()!=='' && totalStock(ex.id)<=0) ex.costPrice=parseNum(r[map.cost]);
        if(map.note!==undefined && String(r[map.note]).trim()) ex.note=String(r[map.note]).trim();
        updated++;
      } else {
        DB.products.push({
          id:uid(), sku:sku, name:name, categoryId:catId,
          brand:map.brand!==undefined?String(r[map.brand]).trim():'',
          unit:map.unit!==undefined&&String(r[map.unit]).trim()?String(r[map.unit]).trim():'cái',
          costPrice:map.cost!==undefined?parseNum(r[map.cost]):0,
          salePrice:map.sale!==undefined?parseNum(r[map.sale]):0,

function doImportPartners(f){
  readSheetFile(f, function(aoa){
    if(!aoa || aoa.length<2) return toast('File không có dữ liệu','error');
    var map=headerMap(aoa[0],[
      {key:'code', match:['ma']},
      {key:'name', match:['ten']},
      {key:'type', match:['loai']},
      {key:'phone',match:['dien thoai','sdt','phone']},
      {key:'addr', match:['dia chi']},
      {key:'tax',  match:['ma so thue','mst']},
      {key:'note', match:['ghi chu']}
    ]);
    if(map.code===undefined||map.name===undefined) return toast('Không tìm thấy cột "Mã" hoặc "Tên" ở dòng tiêu đề','error');
    var added=0, updated=0, errs=[];
    for(var i=1;i<aoa.length;i++){
      var r=aoa[i];
      var code=String(r[map.code]||'').trim().toUpperCase();
      var name=String(r[map.name]||'').trim();
      if(!code&&!name) continue;
      if(!code||!name){ errs.push('Dòng '+(i+1)+': thiếu mã hoặc tên'); continue; }
      var type=PARTF.tab;
      if(map.type!==undefined){
        var tn=normStr(r[map.type]);
        if(tn.indexOf('cung cap')>=0||tn.indexOf('ncc')>=0) type='supplier';
        else if(tn.indexOf('khach')>=0||tn.indexOf('kh')===0) type='customer';
      }
      var ex=DB.partners.find(function(p){return p.code.toUpperCase()===code;});
      var data={
        name:name,
        phone:map.phone!==undefined?String(r[map.phone]).trim():'',
        address:map.addr!==undefined?String(r[map.addr]).trim():'',
        taxCode:map.tax!==undefined?String(r[map.tax]).trim():'',
        note:map.note!==undefined?String(r[map.note]).trim():''
      };
      if(ex){ Object.assign(ex,data); updated++; }
      else { DB.partners.push(Object.assign({id:uid(), code:code, type:type, active:true},data)); added++; }
    }
    audit('Nhập Excel đối tác', f.name+' — thêm '+added+', cập nhật '+updated);
    saveDB();
    openModal({ title:'Kết quả nhập đối tác', size:'sm',
      body:'<div style="font-size:14px;line-height:2">✅ Thêm mới: <b>'+added+'</b><br>🔄 Cập nhật: <b>'+updated+'</b>'+(errs.length?'<br>⚠️ Bỏ qua '+errs.length+' dòng lỗi:<div class="small muted">'+errs.map(esc).join('<br>')+'</div>':'')+'</div>' });
    if(CURRENT_PAGE==='partners') partnerRows();
  });
}

function exportHistory(){
  var list=histData();
  var s1=[['Số phiếu','Loại','Ngày','Kho','Kho nhận','Đối tác','Số dòng','Tổng tiền','Đã thanh toán','Còn nợ','Người lập','Ghi chú','Trạng thái']];
  var s2=[['Số phiếu','Loại','Ngày','Kho','Mã hàng','Tên hàng','ĐVT','Số lượng','Đơn giá','Thành tiền','Giá vốn']];
  list.forEach(function(v){
    var vt=VTYPES[v.type];
    var paid=isMoneyVoucher(v.type)?((v.paid===undefined)?v.total:v.paid):'';
    s1.push([v.code,vt.name,v.date,whName(v.warehouseId),v.type==='transfer'?whName(v.toWarehouseId):'',v.partnerId?partnerName(v.partnerId):'',v.lines.length,v.total,paid,isMoneyVoucher(v.type)&&v.status!=='void'?round2(v.total-(paid||0)):'',v.createdBy,v.note||'',v.status==='void'?'Đã hủy':'Đã ghi sổ']);
    v.lines.forEach(function(l){
      s2.push([v.code,vt.name,v.date,whName(v.warehouseId),l.sku,l.name,l.unit,l.qty,l.price,Math.round(l.qty*l.price),l.cost]);
    });
  });

function exportReport(){
  if(RPT.tab==='nxt'){
    var data=reportNXT(RPT.from,RPT.to,RPT.wh||null);
    var rows=[['Mã','Tên sản phẩm','ĐVT','Tồn đầu kỳ','SL nhập','GT nhập','SL xuất','GT xuất','Tồn cuối kỳ','GT cuối kỳ']];
    data.forEach(function(r){
      rows.push([r.product.sku,r.product.name,r.product.unit,r.openQ,r.inQ,Math.round(r.inV),r.outQ,Math.round(r.outV),r.closeQ,Math.round(r.closeQ*(r.product.costPrice||0))]);
    });
    xlsxExport('bao-cao-nhap-xuat-ton-'+RPT.from+'-den-'+RPT.to, [{name:'NXT',rows:rows}]);
  } else {
    var rp=reportProfit(RPT.from,RPT.to);
    var rows2=[['Mã','Tên sản phẩm','SL bán','SL trả lại','Doanh thu','Giá vốn','Lợi nhuận','Biên LN %']];
    rp.rows.forEach(function(r){
      rows2.push([r.product.sku,r.product.name,r.soldQ,r.returnQ,Math.round(r.revenue),Math.round(r.cogs),Math.round(r.profit),+r.margin.toFixed(1)]);
    });

function doRestore(){
  pickFile('.json', function(f){

    r.onload=function(e){
      var obj=null;
      try{ obj=JSON.parse(e.target.result); }catch(err){ return toast('File không đúng định dạng JSON','error'); }
      if(!obj || !obj.users || !obj.products || !obj.vouchers) return toast('File này không phải file sao lưu của phần mềm quản lý kho','error');
      confirmDlg('Khôi phục dữ liệu',
        'Toàn bộ dữ liệu hiện tại sẽ bị <b>thay thế</b> bằng dữ liệu trong file <b>'+esc(f.name)+'</b>:<br><br>'+
        '· '+obj.products.length+' sản phẩm · '+obj.vouchers.length+' phiếu · '+obj.users.length+' người dùng<br>· Sao lưu gần nhất của file: '+(obj.meta&&obj.meta.updatedAt?fmtDateTime(obj.meta.updatedAt):'—')+'<br><br>Tiếp tục?',
        'Khôi phục', function(){
          DB=migrateDB(obj);
          audit('Khôi phục dữ liệu','Từ file '+f.name);
          saveDB();
          applySettingsUI();
          doLogout('Khôi phục dữ liệu thành công — vui lòng đăng nhập lại.');
        }, true);
    };
    r.readAsText(f,'utf-8');

}
