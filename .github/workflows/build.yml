name: Build web app

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    name: Test and build
    runs-on: ubuntu-latest
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test engine
        run: node test_engine.js

      - name: Build web app
        run: python build.py

      - name: Verify generated file is committed
        run: git diff --exit-code -- quan-ly-kho.html

      - name: Upload web app artifact
        uses: actions/upload-artifact@v4
        with:
          name: quan-ly-kho-web
          path: quan-ly-kho.html
          if-no-files-found: error
          retention-days: 30