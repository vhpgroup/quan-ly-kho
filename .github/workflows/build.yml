name: Build web app

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: desktop/dist/*.exe
          - os: ubuntu-latest
            script: dist:linux
            artifact: desktop/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    env:
      PYTHONUTF8: "1"

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test engine
        run: node test_engine.js

      - name: Build web app tu src
        run: python build.py 

      - name: Cai dependency desktop
        working-directory: desktop
        run: npm install

      - name: Dong goi Electron
        working-directory: desktop
        run: npm run ${{ matrix.script }}

      - name: Tai artifact len
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyKho-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      - name: Dinh kem vao Release (khi push tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}