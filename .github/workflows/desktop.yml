# Build app desktop (Electron) cho Windows & Linux.
# Chạy khi: bấm "Run workflow" trên GitHub (workflow_dispatch), push tag dạng v* (vd v1.1.0),
# hoặc push lên nhánh nang-cap-thuong-mai.
# Kết quả: installer .exe (cài đặt + bản portable) và AppImage trong tab Artifacts;
# nếu build từ tag thì tự đính kèm vào GitHub Release.
name: Desktop build

on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: ['nang-cap-thuong-mai']

env:
  # Runner Windows mặc định dùng cp1252 — ép Python in UTF-8 vì build.py có thông báo tiếng Việt
  PYTHONUTF8: "1"

jobs:
  build:
    strategy:
      # Một hệ điều hành lỗi không hủy job của hệ điều hành còn lại
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            artifact: desktop/dist/*.exe
          - os: ubuntu-latest
            script: dist:linux
            artifact: desktop/dist/*.AppImage
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Đảm bảo lệnh "python" có mặt trên cả Windows lẫn Linux
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Ghép bản web mới nhất từ src/ (đảm bảo desktop đóng gói đúng code hiện tại)
      - name: Build web app tu src
        run: python build.py

      - name: Kiem thu engine
        run: node test_engine.js

      - name: Cai dependency desktop
        working-directory: desktop
        run: npm install

      - name: Dong goi Electron
        working-directory: desktop
        run: npm run ${{ matrix.script }}

      - name: Tai artifact len
        uses: actions/upload-artifact@v4
        with:
          name: QuanLyKho-${{ matrix.os }}
          path: ${{ matrix.artifact }}
          if-no-files-found: error

      # Push tag v* → đính kèm file cài đặt vào Release
      - name: Dinh kem vao Release (khi push tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifact }}
